  <style>
    :root{--red:#b91e37;--red2:#ef3152;--ink:#30292b;--muted:#7d7376;--line:#e9e2e4;--soft:#f8f6f6;--green:#18a969;--shadow:0 14px 42px rgba(54,35,40,.09)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Plus Jakarta Sans","Segoe UI",Arial,sans-serif;color:var(--ink);background:var(--soft)}button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}
    .topbar{position:sticky;top:0;z-index:30;border-bottom:1px solid var(--line);background:rgba(255,255,255,.96);backdrop-filter:blur(16px);box-shadow:0 8px 28px rgba(54,35,40,.05)}

    .title-wrap{display:flex;align-items:center;gap:12px;min-width:0}.page-mark{width:40px;height:40px;display:grid;place-items:center;flex:0 0 40px;border-radius:13px;color:#fff;background:linear-gradient(145deg,var(--red2),var(--red));box-shadow:0 9px 22px rgba(185,30,55,.22);font-weight:800}.title-wrap h1{margin:0;font-size:18px;letter-spacing:-.025em}.title-wrap span{display:block;margin-top:3px;color:var(--muted);font-size:9px}

    .top-actions{display:flex;justify-content:flex-end;gap:9px}.icon-button,.save-button{height:42px;border-radius:12px;transition:.18s}.icon-button{width:42px;display:grid;place-items:center;border:1px solid var(--line);color:var(--ink);background:#fff}.icon-button:hover{color:var(--red);transform:translateY(-1px)}.icon-button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.save-button{min-width:112px;border:0;padding:0 20px;color:#fff;background:linear-gradient(135deg,var(--red),var(--red2));box-shadow:0 9px 22px rgba(185,30,55,.22);font-size:11px;font-weight:800}.save-button:hover{transform:translateY(-1px);box-shadow:0 12px 26px rgba(185,30,55,.29)}.save-button:disabled{cursor:not-allowed;opacity:.5;transform:none;box-shadow:none}

    .loading,.empty{padding:70px 20px;text-align:center;color:var(--muted);font-size:12px}.skeleton{display:block;height:12px;border-radius:8px;background:linear-gradient(90deg,#f0ebec 25%,#faf8f8 40%,#f0ebec 65%);background-size:300% 100%;animation:shine 1.2s infinite}.toast{position:fixed;right:20px;bottom:20px;z-index:80;max-width:min(390px,calc(100vw - 40px));padding:13px 16px;border-radius:12px;color:#fff;background:#30292b;box-shadow:0 16px 38px rgba(30,20,23,.22);font-size:11px;line-height:1.5;opacity:0;transform:translateY(18px);pointer-events:none;transition:.22s}.toast.show{opacity:1;transform:none}.toast.error{background:#a71932}

    @media(max-width:760px){.topbar-inner{min-height:auto;padding:11px 14px;grid-template-columns:1fr auto;gap:11px}.title-wrap{grid-column:1}.title-wrap span{display:none}.title-wrap h1{font-size:16px}.page-mark{width:36px;height:36px;flex-basis:36px}.date-field{grid-column:1;grid-row:2;align-items:center;grid-template-columns:auto minmax(0,1fr)}.date-field label{text-align:left}.date-field input{width:100%;height:38px}.top-actions{grid-column:2;grid-row:1/3;align-self:stretch;display:grid;grid-template-columns:42px 1fr}.save-button{min-width:78px;padding:0 12px}.container{padding:14px}.progress-card{padding:14px;margin-bottom:13px;border-radius:15px}.progress-title{font-size:12px}.table-card{overflow:visible;border:0;background:transparent;box-shadow:none}.table-wrap{overflow:visible}.log-table,.log-table tbody{display:block}.log-table thead{display:none}.log-table tr{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:11px;padding:14px;border:1px solid var(--line);border-radius:15px;background:#fff;box-shadow:0 7px 22px rgba(54,35,40,.05)}.log-table td{display:block;padding:0;border:0;text-align:left}.log-table .item-cell{grid-column:1/3}.log-table .balance-cell{grid-column:3;text-align:right}.log-table .metric-total,.log-table .metric-input{grid-row:auto}.log-table .metric-total{padding:8px 9px;border-radius:9px;background:#f8f5f5}.log-table .metric-total:before,.log-table .metric-input:before{display:block;margin-bottom:5px;color:#8b7f82;font-size:7px;font-weight:800;letter-spacing:.07em;text-transform:uppercase}.log-table td[data-kind="in-total"]:before{content:'In · Total'}.log-table td[data-kind="sold-total"]:before{content:'Sold · Total'}.log-table td[data-kind="waste-total"]:before{content:'Waste · Total'}.log-table td[data-kind="in-input"]:before{content:'In · Input'}.log-table td[data-kind="sold-input"]:before{content:'Sold · Input'}.log-table td[data-kind="waste-input"]:before{content:'Waste · Input'}.qty-input{min-width:0}.progress-     .app-header{position:sticky;top:0;z-index:60;height:74px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.96);box-shadow:0 8px 28px rgba(54,35,40,.055);backdrop-filter:blur(16px)}.app-header-inner{width:min(100%,1600px);height:100%;margin:auto;padding:0 30px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:30px}.top-brand{display:flex;align-items:center;gap:11px;color:var(--ink);text-decoration:none}.top-brand-mark{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;color:#fff;background:linear-gradient(145deg,#c72a43,#9f172b);box-shadow:0 8px 20px rgba(159,23,43,.18);font-size:13px;font-weight:800}.top-brand-copy strong{display:block;font-size:14px}.top-brand-copy small{display:block;margin-top:2px;color:#93898c;font-size:8px}.top-navigation{display:flex;align-self:stretch;align-items:center;gap:4px;min-width:0}.top-nav-button{height:42px;display:flex;align-items:center;gap:7px;padding:0 12px;border:0;border-radius:11px;color:#665c5f;background:transparent;font-size:11px;font-weight:600;white-space:nowrap}.top-nav-button:hover{color:var(--red);background:#faf0f2}.top-nav-button.active{color:#fff;background:linear-gradient(135deg,var(--red),var(--red2))}.top-nav-count{min-width:20px;padding:3px 6px;border-radius:7px;color:#817679;background:#f1edee;font-size:7px;text-align:center}.top-nav-button.active .top-nav-count{color:#fff;background:rgba(255,255,255,.17)}.top-chevron{font-size:10px;transition:transform .2s}.nav-menu{position:relative;display:flex;align-items:center;height:100%}.mega-menu{position:absolute;z-index:70;left:0;top:calc(100% - 6px);width:min(330px,calc(100vw - 28px));max-height:min(520px,calc(100vh - 100px));padding:12px;overflow:auto;border:1px solid #e7dfe1;border-radius:14px;background:#fff;box-shadow:0 22px 55px rgba(48,32,37,.15);opacity:0;visibility:hidden;transform:translateY(7px);transition:.18s;pointer-events:none}.nav-menu.open .mega-menu{opacity:1;visibility:visible;transform:none;pointer-events:auto}.nav-menu.open .top-chevron{transform:rotate(180deg)}.mega-menu-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:9px;padding:0 2px 9px;border-bottom:1px solid #eee8e9}.mega-menu-head strong{font-size:12px}.mega-view-all{border:0;border-radius:9px;padding:7px 10px;color:var(--red);background:#faedef;font-size:9px;font-weight:700}.mega-task-grid{display:grid;grid-template-columns:1fr;gap:6px}.mega-task{display:grid;grid-template-columns:25px minmax(0,1fr);align-items:center;gap:9px;min-height:42px;padding:7px 9px;border:1px solid #eee7e9;border-radius:10px;color:var(--ink);background:#fff;text-decoration:none}.mega-task-status{width:24px;height:24px;display:grid;place-items:center;border-radius:8px;color:#a69da0;background:#f5f1f2;font-size:14px}.mega-task.done .mega-task-status{color:#fff;background:#20b875}.mega-task-title{overflow:hidden;text-overflow:ellipsis;font-size:10px;font-weight:600;white-space:nowrap}.mega-empty{padding:18px;border:1px dashed #dfd5d8;border-radius:10px;color:#92878a;text-align:center;font-size:10px}.top-user{display:grid;grid-template-columns:36px minmax(0,auto) 36px;align-items:center;gap:9px;padding-left:17px;border-left:1px solid var(--line)}.top-user-avatar{width:36px;height:36px;display:grid;place-items:center;border-radius:11px;color:#fff;background:linear-gradient(145deg,#c72a43,#7a192b);font-size:10px;font-weight:700}.top-user-copy{max-width:185px;min-width:0}.top-user-copy strong,.top-user-copy span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.top-user-copy strong{font-size:10px}.top-user-copy span{margin-top:3px;color:#93898c;font-size:8px}.logout-icon-button{width:36px;height:36px;display:grid;place-items:center;border:1px solid #e5dddf;border-radius:11px;color:#83777a;background:#fff;font-size:17px}.logout-icon-button:hover{color:#fff;border-color:var(--red);background:var(--red)}.top-menu-toggle{display:none;width:38px;height:38px;border:1px solid var(--line);border-radius:11px;background:#fff}.page-toolbar{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:14px;margin-bottom:18px;padding-bottom:18px;border-bottom:1px solid var(--line)}.search-toolbar{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);background:#fff}.global-search{position:relative;flex:1}.global-search .material-symbols-rounded{position:absolute;left:13px;top:50%;color:#94898c;font-size:19px;transform:translateY(-50%)}.global-search input{width:100%;height:42px;padding:0 42px;border:1px solid #e2dbdd;border-radius:12px;color:var(--ink);background:#faf9f9;outline:0}.global-search input:focus{border-color:var(--red);box-shadow:0 0 0 4px rgba(185,30,55,.07)}.clear-search{position:absolute;right:7px;top:6px;width:30px;height:30px;border:0;border-radius:9px;color:#807578;background:transparent}.search-count{color:var(--muted);font-size:9px;white-space:nowrap}
    @media(max-width:1100px){.app-header-inner{display:flex;gap:14px;padding:0 20px}.top-menu-toggle{order:3;display:grid;place-items:center}.top-user{order:2;margin-left:auto}.top-navigation{position:absolute;left:20px;right:20px;top:calc(100% + 8px);display:none;max-height:calc(100vh - 100px);padding:10px;overflow:auto;border:1px solid #e5dddf;border-radius:16px;background:#fff;box-shadow:0 24px 60px rgba(45,30,35,.2)}.top-navigation.open{display:flex;align-items:stretch;flex-direction:column}.top-nav-button{width:100%;justify-content:space-between}.nav-menu{display:block;height:auto}.mega-menu{position:static;display:none;width:100%;margin:4px 0 8px;opacity:1;visibility:visible;transform:none;box-shadow:none;pointer-events:auto}.nav-menu.open .mega-menu{display:block}}
    @media(max-width:760px){.app-header{height:68px}.app-header-inner{padding:0 12px;gap:9px}.top-brand-copy small{display:none}.top-user{gap:7px;padding-left:9px}.top-user-avatar{display:none}.top-user-copy{max-width:120px}.top-navigation{left:12px;right:12px}.page-toolbar{grid-template-columns:minmax(0,1fr) auto;gap:11px}.page-toolbar .title-wrap{grid-column:1}.page-toolbar .date-field{grid-column:1;grid-row:2}.page-toolbar .top-actions{grid-column:2;grid-row:1/3;display:block;align-self:center}.search-toolbar{padding:11px;flex-wrap:wrap}.search-count{width:100%;text-align:right}}

<body>
  <header class="app-header"><div class="app-header-inner"><a class="top-brand" href="index.html"><span class="top-brand-mark">B</span><span class="top-brand-copy"><strong>BAKERZIN</strong><small>Internal Hub</small></span></a><button id="showcaseMenuToggle" class="top-menu-toggle" type="button" aria-label="Buka menu" aria-expanded="false">☰</button><nav id="showcaseNavigation" class="top-navigation" aria-label="Navigasi utama"></nav><div class="top-user"><div id="showcaseUserAvatar" class="top-user-avatar">BZ</div><div id="showcaseUser" class="top-user-copy"><strong>—</strong><span>—</span></div><button class="logout-icon-button" type="button" aria-label="Kembali ke Dashboard" title="Kembali ke Dashboard" onclick="backToDashboard()"><span class="material-symbols-rounded" aria-hidden="true">door_open</span></button></div></div></header>
  <main class="container">
    <section class="page-toolbar"><div class="title-wrap"><div class="page-mark">S</div><div><h1>Showcase Log</h1><span>Daily Stock Movement</span></div></div><label class="date-field"><span>Tanggal</span><input id="eventDate" type="date"></label><div class="top-actions"><button id="saveButton" class="save-button" type="button">Simpan</button></div></section>
    <section class="progress-card"><h2 class="progress-title">Progress Showcase Harian</h2><div id="progressGrid" class="progress-grid"><div class="loading">Memuat progress...</div></div></section>
    <section class="table-card">
      <div class="search-toolbar"><label class="global-search"><span class="material-symbols-rounded" aria-hidden="true">search</span><input id="searchInput" type="search" autocomplete="off" placeholder="Cari kode, kategori, nama, atau unit..."><button id="clearSearch" class="clear-search hidden" type="button" aria-label="Hapus pencarian">×</button></label><span id="searchCount" class="search-count">0 item</span></div>
      <div class="table-wrap">
        <table class="log-table">
          <thead><tr><th class="item-head" rowspan="2">Item Showcase</th><th colspan="2">In</th><th colspan="2">Sold</th><th colspan="2">Waste</th><th class="balance-head" rowspan="2">Balance</th></tr><tr><th>Total</th><th>Input</th><th>Total</th><th>Input</th><th>Total</th><th>Input</th></tr></thead>
          <tbody id="itemRows"><tr><td colspan="8" class="loading">Memuat item Showcase...</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>
  <div id="toast" class="toast"></div>
  <script>
    var STATE={token:readToken(),outlet:readOutlet(),items:[],progress:null,saving:false,search:'',drafts:{},user:null,tasks:[],completions:{}};
    function byId(id){return document.getElementById(id)}
    function readToken(){try{return localStorage.getItem('bakerzin_session')||''}catch(error){return''}}
    function readOutlet(){try{return localStorage.getItem('bakerzin_selected_outlet')||''}catch(error){return''}}
    function siteBase(){var configured=window.BAKERZIN_CONFIG&&window.BAKERZIN_CONFIG.SITE_BASE_URL;if(configured)return String(configured).replace(/\/?$/,'/');return location.href.replace(/[^/?#]+(?:[?#].*)?$/,'')}
    function today(){var d=new Date(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return d.getFullYear()+'-'+m+'-'+day}
    function call(name,args,success){BAKERZIN_API.call(name,args).then(function(result){if(!result||!result.ok)throw new Error(result&&result.error?result.error:'Terjadi kesalahan.');success(result.data)}).catch(function(error){toast(error.message||'Tidak dapat terhubung ke server.',true);setSaving(false)})}
    function escapeHtml(value){return String(value||'').replace(/[&<>"']/g,function(char){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]})}
    function escapeAttr(value){return escapeHtml(value).replace(/`/g,'&#96;')}
    function formatQty(value){return Number(value||0).toLocaleString('id-ID',{maximumFractionDigits:3})}
    function toast(message,error){var el=byId('toast');el.textContent=message;el.className='toast show'+(error?' error':'');clearTimeout(toast.timer);toast.timer=setTimeout(function(){el.className='toast'},4200)}
    function backToDashboard(){window.top.location.href=siteBase()+'index.html'}
    function setSaving(value){STATE.saving=value;byId('saveButton').disabled=value;byId('saveButton').textContent=value?'Menyimpan...':'Simpan';document.querySelectorAll('.qty-input').forEach(function(input){input.disabled=value})}
    function initials(name){var words=String(name||'').trim().split(/\s+/).filter(Boolean);return((words[0]||'B').charAt(0)+(words.length>1?words[words.length-1].charAt(0):'')).toUpperCase()}
    function frequencyLabel(value){return({DAILY:'Daily',WEEKLY:'Weekly',MONTHLY:'Monthly',YEARLY:'Yearly'})[value]||value}
    function taskIcon(task){var icon=String(task&&task.icon||'').toLowerCase().replace(/[^a-z0-9_]/g,'');if(icon)return icon;if(task&&task.target==='StockCard')return'inventory_2';return task&&task.type==='FORM'?'assignment':'link'}
    function taskDestination(task){var target=String(task.target||''),path=target==='StockCard'?'stock-card.html':target.replace(/\.html?$/i,'')+'.html';return{url:task.type==='LINK'?target:siteBase()+path+'?task='+encodeURIComponent(task.id),attrs:task.type==='LINK'?'target="_blank" rel="noopener"':'target="_top"'}}
    function renderHeader(){var user=STATE.user||{};byId('showcaseUser').innerHTML='<strong>'+escapeHtml(user.name||'Rekan Bakerzin')+'</strong><span>'+escapeHtml(user.nik||'—')+' · '+escapeHtml(user.outlet||'—')+'</span>';byId('showcaseUserAvatar').textContent=initials(user.name||'Bakerzin');var nav=byId('showcaseNavigation'),html='<button class="top-nav-button" data-dashboard type="button">Dashboard</button>';['DAILY','WEEKLY','MONTHLY','YEARLY'].forEach(function(frequency){var tasks=STATE.tasks.filter(function(task){return task.frequency===frequency}),rows=tasks.length?tasks.map(function(task){var done=!!STATE.completions[task.id+'|'+task.periodKey],destination=taskDestination(task);return'<a class="mega-task '+(done?'done':'')+'" href="'+escapeAttr(destination.url)+'" '+destination.attrs+'><span class="mega-task-status material-symbols-rounded">'+escapeHtml(taskIcon(task))+'</span><span class="mega-task-title">'+escapeHtml(task.title)+'</span></a>'}).join(''):'<div class="mega-empty">Belum ada pekerjaan.</div>';html+='<div class="nav-menu"><button class="top-nav-button '+(frequency==='DAILY'?'active':'')+'" data-period="'+frequency+'" type="button" aria-expanded="false"><span>'+frequencyLabel(frequency)+'</span><span class="top-nav-count">'+tasks.length+'</span><span class="top-chevron">⌄</span></button><div class="mega-menu"><div class="mega-menu-head"><strong>'+frequencyLabel(frequency)+'</strong><button class="mega-view-all" data-view="'+frequency+'" type="button">Lihat semua</button></div><div class="mega-task-grid">'+rows+'</div></div></div>'});nav.innerHTML=html;nav.querySelector('[data-dashboard]').addEventListener('click',backToDashboard);nav.querySelectorAll('[data-period]').forEach(function(button){button.addEventListener('click',function(){var menu=button.closest('.nav-menu'),opening=!menu.classList.contains('open');closeShowcaseMenus(false);menu.classList.toggle('open',opening);button.setAttribute('aria-expanded',String(opening))})});nav.querySelectorAll('[data-view]').forEach(function(button){button.addEventListener('click',function(){window.top.location.href=siteBase()+'index.html?page='+encodeURIComponent(button.dataset.view)})})}
    function closeShowcaseMenus(closeNavigation){document.querySelectorAll('#showcaseNavigation .nav-menu.open').forEach(function(menu){menu.classList.remove('open');var button=menu.querySelector('[data-period]');if(button)button.setAttribute('aria-expanded','false')});if(closeNavigation){byId('showcaseNavigation').classList.remove('open');byId('showcaseMenuToggle').setAttribute('aria-expanded','false')}}
    function toggleShowcaseMenu(){var nav=byId('showcaseNavigation'),button=byId('showcaseMenuToggle'),opening=!nav.classList.contains('open');if(!opening)closeShowcaseMenus(false);nav.classList.toggle('open',opening);button.setAttribute('aria-expanded',String(opening))}
    function load(){if(!STATE.token){toast('Sesi login tidak ditemukan. Silakan kembali ke Dashboard.',true);return}var date=byId('eventDate').value||today();STATE.drafts={};byId('itemRows').innerHTML='<tr><td colspan="8" class="loading">Memuat item Showcase...</td></tr>';call('showcaseLogBootstrap',[STATE.token,STATE.outlet,date],function(data){STATE.outlet=data.selectedOutlet;STATE.items=data.items||[];STATE.progress=data.progress;STATE.user=data.user||STATE.user;STATE.tasks=data.tasks||STATE.tasks;STATE.completions=data.completions||STATE.completions;try{localStorage.setItem('bakerzin_selected_outlet',STATE.outlet)}catch(error){}renderHeader();renderItems();renderProgress()})}
    function inputHtml(index,field){var draft=STATE.drafts[index]||{},value=draft[field]===undefined?'':draft[field];return '<input class="qty-input" data-index="'+index+'" data-field="'+field+'" type="number" min="0" step="0.001" inputmode="decimal" value="'+escapeAttr(value)+'" placeholder="">'}
    function renderItems(){var body=byId('itemRows'),query=STATE.search.trim().toLowerCase(),visible=STATE.items.map(function(item,index){return{item:item,index:index}}).filter(function(entry){var item=entry.item,haystack=[item.code,item.category,item.name,item.unit].join(' ').toLowerCase();return !query||haystack.indexOf(query)>=0});byId('searchCount').textContent=visible.length+' dari '+STATE.items.length+' item';byId('clearSearch').classList.toggle('hidden',!query);if(!STATE.items.length){body.innerHTML='<tr><td colspan="8" class="empty">Item Showcase belum tersedia.</td></tr>';return}if(!visible.length){body.innerHTML='<tr><td colspan="8" class="empty">Tidak ada item yang sesuai dengan pencarian.</td></tr>';return}body.innerHTML=visible.map(function(entry){var item=entry.item,index=entry.index,negative=Number(item.balance)<0;return '<tr><td class="item-cell"><strong>'+escapeHtml(item.name)+'</strong><span>'+escapeHtml(item.category)+' · '+escapeHtml(item.code)+'</span></td><td class="metric-total total" data-kind="in-total" id="inTotal'+index+'">'+formatQty(item.totalIn)+'</td><td class="metric-input" data-kind="in-input">'+inputHtml(index,'inQty')+'</td><td class="metric-total total" data-kind="sold-total" id="soldTotal'+index+'">'+formatQty(item.totalSold)+'</td><td class="metric-input" data-kind="sold-input">'+inputHtml(index,'soldQty')+'</td><td class="metric-total total" data-kind="waste-total" id="wasteTotal'+index+'">'+formatQty(item.totalWaste)+'</td><td class="metric-input" data-kind="waste-input">'+inputHtml(index,'wasteQty')+'</td><td class="balance-cell"><span id="balance'+index+'" class="balance '+(negative?'negative':'')+'">'+formatQty(item.balance)+'</span></td></tr>'}).join('')}
    function renderProgress(){var progress=STATE.progress||{},days=progress.days||[],grid=byId('progressGrid');if(!days.length){grid.innerHTML='<div class="loading">Progress belum tersedia.</div>';return}grid.style.setProperty('--days',days.length);var rows=[{label:'Stock In',key:'stockIn'},{label:'Sold',key:'sold'},{label:'Waste',key:'waste'}],html='<div class="progress-label">Tanggal</div>';html+=days.map(function(day){return'<div class="progress-date">'+day.day+'</div>'}).join('');rows.forEach(function(row){html+='<div class="progress-label">'+row.label+'</div>';html+=days.map(function(day){var done=Boolean(day[row.key]),state=day.future?'future':done?'done':'missing';return'<div class="progress-day '+state+' '+(day.date===progress.selectedDate?'today':'')+'" title="'+escapeAttr(row.label+' · '+day.date+' · '+(done?'Selesai':'Belum'))+'"></div>'}).join('')});grid.innerHTML=html}
    function collectEntries(){return Object.keys(STATE.drafts).map(function(index){var draft=STATE.drafts[index],item=STATE.items[Number(index)],entry={itemCode:item.code,inQty:0,soldQty:0,wasteQty:0,hasInInput:false,hasSoldInput:false,hasWasteInput:false};['inQty','soldQty','wasteQty'].forEach(function(field){if(draft[field]===undefined||draft[field]==='')return;var qty=Number(draft[field]);if(!isFinite(qty)||qty<0)return;entry[field]=qty;entry[field==='inQty'?'hasInInput':field==='soldQty'?'hasSoldInput':'hasWasteInput']=true});return entry}).filter(function(entry){return entry.hasInInput||entry.hasSoldInput||entry.hasWasteInput})}
    function save(){if(STATE.saving)return;var entries=collectEntries();if(!entries.length){toast('Isi minimal satu kolom In, Sold, atau Waste.',true);return}setSaving(true);call('saveShowcaseLog',[STATE.token,{outlet:STATE.outlet,eventDate:byId('eventDate').value,entries:entries}],function(data){(data.entries||[]).forEach(function(saved){var index=STATE.items.findIndex(function(item){return item.code===saved.itemCode});if(index<0)return;var item=STATE.items[index];item.totalIn+=Number(saved.inQty||0);item.totalSold+=Number(saved.soldQty||0);item.totalWaste+=Number(saved.wasteQty||0);item.balance+=Number(saved.inQty||0)-Number(saved.soldQty||0)-Number(saved.wasteQty||0)});STATE.drafts={};STATE.progress=data.progress;renderItems();renderProgress();setSaving(false);toast(data.completed?'Showcase Log tersimpan. Daily hari ini selesai.':'Showcase Log tersimpan. Lengkapi In, Sold, dan Waste untuk menyelesaikan Daily.')})}
    byId('eventDate').value=today();byId('eventDate').max=today();byId('eventDate').addEventListener('change',load);byId('saveButton').addEventListener('click',save);byId('searchInput').addEventListener('input',function(event){STATE.search=event.target.value;renderItems()});byId('clearSearch').addEventListener('click',function(){STATE.search='';byId('searchInput').value='';renderItems();byId('searchInput').focus()});byId('itemRows').addEventListener('input',function(event){var input=event.target;if(!input.classList.contains('qty-input'))return;var index=input.dataset.index;if(!STATE.drafts[index])STATE.drafts[index]={};STATE.drafts[index][input.dataset.field]=input.value});byId('showcaseMenuToggle').addEventListener('click',toggleShowcaseMenu);document.addEventListener('keydown',function(event){if(event.key==='Escape')closeShowcaseMenus(true)});document.addEventListener('click',function(event){if(!event.target.closest('#showcaseNavigation'))closeShowcaseMenus(false)});load();
  </script>
