<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pesan · BI-Space</title>
</head>
<body>
<script>
(function(){
  function fail(e){
    document.body.innerHTML = "<p style=\"font-family:sans-serif;padding:24px\">Gagal memuat chat.<br><small>"+e+"</small></p>";
  }
  function gunzipB64(b64){
    var bin = Uint8Array.from(atob(b64.replace(/\s/g,'')), function(c){ return c.charCodeAt(0); });
    if (typeof DecompressionStream === 'undefined') return Promise.reject(new Error('Browser tidak mendukung DecompressionStream'));
    var stream = new Response(bin).body.pipeThrough(new DecompressionStream('gzip'));
    return new Response(stream).text();
  }
  fetch('chat.gz.b64?v=r3').then(function(r){ return r.text(); }).then(gunzipB64).then(function(html){
    document.open(); document.write(html); document.close();
  }).catch(fail);
})();
</script>
</body>
</html>
