<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pesan · BI-Space</title>
</head>
<body>
<script>
(function(){
  var url = "https://raw.githubusercontent.com/operationalbi-pixel/form/abe0288ab35fee15be3a372cdde8048120c4d5b5/docs/chat.html";
  fetch(url).then(function(r){return r.text()}).then(function(html){
    document.open();
    document.write(html);
    document.close();
  }).catch(function(e){
    document.body.innerHTML = "<p style=\"font-family:sans-serif;padding:24px\">Gagal memuat chat. Refresh atau hubungi admin.<br><small>"+e+"</small></p>";
  });
})();
</script>
</body>
</html>
