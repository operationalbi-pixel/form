  <style>
    :root{--wine:#a91431;--wine-dark:#6e1424;--ink:#2c2528;--muted:#8b8084;--line:#eee5e7;--soft:#faf6f7;--yellow:#fff5d2}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#f5f0f1;color:var(--ink);font-family:'DM Sans',sans-serif}button,input,textarea,select{font:inherit}.app{height:100dvh;display:grid;grid-template-columns:300px 1fr;background:#fff}.side{border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;background:#fff}.brand{min-height:calc(78px + env(safe-area-inset-top));height:auto;padding:calc(18px + env(safe-area-inset-top)) 20px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,var(--wine-dark),var(--wine));color:#fff;display:grid;place-items:center;font-weight:800;flex:0 0 auto}.brand h1{font-size:18px;margin:0}.brand p{font-size:11px;margin:3px 0 0;color:var(--muted)}.side-body{padding:15px 15px max(15px,env(safe-area-inset-bottom));overflow:auto}.create{width:100%;border:0;border-radius:14px;background:var(--wine);color:#fff;padding:13px;font-weight:700;cursor:pointer;box-shadow:0 8px 22px rgba(169,20,49,.18)}.bootstrap-state{margin:14px 0 4px;padding:13px;border:1px solid var(--line);border-radius:14px;background:var(--soft);font-size:11px;line-height:1.45;color:var(--muted)}.bootstrap-state.error{border-color:#efb6c1;background:#fff2f4;color:#7d1830}.bootstrap-state button{display:none;margin-top:9px;border:0;border-radius:10px;background:var(--wine);color:#fff;padding:8px 11px;font-weight:700;cursor:pointer}.bootstrap-state.error button{display:inline-block}.bootstrap-state.hidden{display:none}.group-label{font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.12em;margin:22px 8px 8px}.room{width:100%;border:0;background:transparent;border-radius:14px;padding:12px;display:flex;align-items:center;gap:11px;text-align:left;cursor:pointer;color:var(--ink)}.room:hover,.room.active{background:#f9ecef;color:var(--wine)}.room-icon{width:38px;height:38px;border-radius:13px;background:#f4e5e8;display:grid;place-items:center;font-weight:700}.room-copy{flex:1;min-width:0}.room-copy strong{display:block;font-size:14px}.room-copy span{font-size:11px;color:var(--muted)}.count{min-width:21px;height:21px;padding:0 6px;border-radius:12px;background:var(--wine);color:#fff;font-size:10px;display:grid;place-items:center}.main{display:flex;flex-direction:column;min-width:0;height:100dvh}.top{height:auto;min-height:calc(78px + env(safe-area-inset-top));border-bottom:1px solid var(--line);display:flex;align-items:center;padding:env(safe-area-inset-top) 22px 0;gap:14px}.back{display:none}.top-avatar{width:40px;height:40px;border-radius:14px;background:#f4e5e8;color:var(--wine);display:grid;place-items:center;font-weight:700}.top h2{margin:0;font-size:17px}.top p{margin:3px 0 0;font-size:11px;color:var(--muted)}.top .close{margin-left:auto;width:40px;height:40px;border:1px solid var(--line);border-radius:13px;background:#fff;cursor:pointer}.pins{display:none;padding:10px 18px;background:#fffdf5;border-bottom:1px solid #f2e4a9;gap:9px;overflow:auto}.pins.visible{display:flex}.pin{min-width:260px;max-width:360px;background:var(--yellow);border:1px solid #efd986;border-radius:13px;padding:10px 12px;display:flex;gap:10px;align-items:center}.pin-copy{flex:1;min-width:0}.pin strong{font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pin span{font-size:10px;color:#7e7045}.pin button{border:0;background:var(--wine);color:#fff;border-radius:10px;padding:7px 9px;font-size:10px;cursor:pointer}.messages{flex:1;overflow:auto;padding:20px 24px;background:linear-gradient(rgba(255,255,255,.94),rgba(255,255,255,.94)),radial-gradient(circle at 10px 10px,#eadcdf 1px,transparent 1px);background-size:auto,24px 24px}.empty{text-align:center;color:var(--muted);margin:12vh auto;max-width:340px}.message{display:flex;margin:8px 0;gap:9px;align-items:flex-end}.message.mine{justify-content:flex-end}.bubble{max-width:min(680px,76%);background:#fff;border:1px solid var(--line);border-radius:6px 18px 18px 18px;padding:10px 12px;box-shadow:0 3px 12px rgba(55,32,38,.05)}.mine .bubble{background:#fff1f4;border-color:#f0ccd4;border-radius:18px 6px 18px 18px}.system .bubble{margin:auto;border:0;background:#f2edef;color:#76696e;border-radius:12px;font-size:11px;text-align:center}.sender{font-size:10px;color:var(--wine);font-weight:700;margin-bottom:4px}.text{font-size:13px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}.meta{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:5px;color:var(--muted);font-size:9px}.read-link{border:0;background:transparent;color:var(--wine);padding:0;cursor:pointer}.attachments{display:grid;gap:6px;margin-top:8px}.attachment{border:1px solid #eadde0;background:#fff;border-radius:10px;padding:8px 10px;display:flex;gap:8px;align-items:center;cursor:pointer;text-align:left;font-size:11px}.task-card{margin-top:8px;border-left:3px solid var(--wine);background:#fff8e2;padding:9px;border-radius:9px}.task-card strong{display:block;font-size:12px}.task-card span{font-size:10px;color:#796c47}.composer{padding:12px 18px max(12px,env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:9px;align-items:flex-end;background:#fff}.attach-btn,.send-btn{width:44px;height:44px;border:0;border-radius:14px;cursor:pointer;display:grid;place-items:center}.attach-btn{background:#f5edef;color:var(--wine)}.send-btn{background:var(--wine);color:#fff}.composer textarea{flex:1;min-height:44px;max-height:120px;resize:none;border:1px solid var(--line);border-radius:15px;padding:11px 13px;outline:none}.composer textarea:focus{border-color:#d38a99}.file-strip{position:absolute;bottom:78px;left:318px;right:18px;display:none;gap:6px;overflow:auto}.file-strip.visible{display:flex}.file-chip{background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 9px;font-size:10px;box-shadow:0 5px 14px rgba(0,0,0,.08)}.modal-layer{position:fixed;inset:0;z-index:20;background:rgba(37,19,24,.52);display:none;align-items:center;justify-content:center;padding:16px}.modal-layer.open{display:flex}.modal{width:min(620px,100%);max-height:min(820px,calc(100dvh - 32px));overflow:auto;background:#fff;border-radius:22px;padding:22px;box-shadow:0 25px 70px rgba(48,19,27,.35)}.modal-head{display:flex;align-items:center;margin-bottom:18px}.modal-head h3{margin:0;font-size:19px}.x{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:11px;width:36px;height:36px;cursor:pointer}.field{margin:13px 0}.field label{display:block;font-size:10px;font-weight:700;color:#665b5f;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;outline:none}.field textarea{min-height:86px;resize:vertical}.choice{display:flex;gap:8px}.choice label{flex:1;border:1px solid var(--line);border-radius:12px;padding:11px;text-align:center;cursor:pointer}.choice label:has(input:checked){border-color:var(--wine);background:#fff0f3;color:var(--wine)}.choice input{width:auto}.picker{max-height:180px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:5px}.pick{display:flex;align-items:center;gap:9px;padding:8px;border-radius:8px}.pick:hover{background:var(--soft)}.pick input{width:auto}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.secondary,.primary{border:0;border-radius:12px;padding:11px 16px;cursor:pointer}.secondary{background:#f4edef}.primary{background:var(--wine);color:#fff;font-weight:700}.toast{position:fixed;z-index:40;right:18px;bottom:18px;background:#481821;color:#fff;border-radius:13px;padding:11px 14px;font-size:11px;opacity:0;transform:translateY(12px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:none}.loading{opacity:.55;pointer-events:none}
    @media(max-width:720px){.app{grid-template-columns:1fr}.side{position:fixed;inset:0;z-index:4}.side.room-open{display:none}.main{display:none}.main.room-open{display:flex}.top{height:auto;min-height:calc(66px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 12px 0}.back{display:grid;width:36px;height:36px;border:1px solid var(--line);border-radius:11px;background:#fff;place-items:center}.top-avatar{width:36px;height:36px}.top h2{font-size:15px}.messages{padding:15px 12px}.bubble{max-width:86%}.composer{padding-left:10px;padding-right:10px}.brand{min-height:calc(76px + env(safe-area-inset-top));padding:calc(16px + env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) 16px max(18px,env(safe-area-inset-left))}.side-body{padding-left:max(15px,env(safe-area-inset-left));padding-right:max(15px,env(safe-area-inset-right))}.file-strip{left:10px;right:10px;bottom:76px}.modal-layer{padding:0;align-items:flex-end}.modal{border-radius:22px 22px 0 0;max-height:calc(92dvh - env(safe-area-inset-top));padding-bottom:max(20px,env(safe-area-inset-bottom))}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="side" id="side"><div class="brand"><div class="logo">BI</div><div><h1>Pesan & Tugas</h1><p id="userLabel">Menghubungkan akun...</p></div></div><div class="side-body"><button class="create" id="createTask" disabled>＋ Create Task</button><div class="bootstrap-state" id="bootstrapState"><strong id="bootstrapStateTitle">Menyiapkan pesan...</strong><div id="bootstrapStateMessage">Menghubungkan akun dan database grup.</div><button type="button" id="retryBootstrap">Coba Lagi</button></div><div class="group-label">GROUP</div><div id="rooms"></div></div></aside>
    <main class="main" id="main"><header class="top"><button class="back" id="back">‹</button><div class="top-avatar">BI</div><div><h2 id="roomTitle">Pilih Grup</h2><p id="roomSubtitle">Tidak tersedia chat pribadi</p></div><button class="close" id="close" aria-label="Tutup">✕</button></header><section class="pins" id="pins"></section><section class="messages" id="messages"><div class="empty">Pilih General atau grup Outlet untuk mulai berkomunikasi.</div></section><div class="file-strip" id="fileStrip"></div><form class="composer" id="composer"><input id="files" type="file" multiple accept="image/*,.pdf,.xls,.xlsx,.doc,.docx" hidden><button type="button" class="attach-btn" id="attach" title="Lampiran">＋</button><textarea id="messageInput" placeholder="Tulis pesan grup..." rows="1" disabled></textarea><button class="send-btn" id="send" disabled aria-label="Kirim">➤</button></form></main>
  </div>
  <div class="modal-layer" id="taskModal"><div class="modal"><div class="modal-head"><h3>Buat Tugas</h3><button class="x" data-close="taskModal">✕</button></div><div class="field"><label>JUDUL TUGAS</label><input id="taskTitle" maxlength="180" placeholder="Contoh: Periksa suhu freezer"></div><div class="field"><label>DESKRIPSI</label><textarea id="taskDescription" placeholder="Petunjuk tugas..."></textarea></div><div class="field"><label>ASSIGN TO</label><select id="taskRoom"></select></div><div class="field"><label>PIC</label><div class="choice"><label><input type="radio" name="picType" value="OUTLET" checked> Outlet</label><label><input type="radio" name="picType" value="PERSON"> Person</label></div></div><div class="field"><label id="pickerLabel">PILIH OUTLET</label><div class="picker" id="taskPicker"></div></div><div class="field"><label>BATAS WAKTU (OPSIONAL)</label><input id="taskDue" type="datetime-local"></div><div class="field"><label>LAMPIRAN (OPSIONAL, MAKS. 5)</label><input id="taskFiles" type="file" multiple accept="image/*,.pdf,.xls,.xlsx,.doc,.docx"></div><div class="modal-actions"><button class="secondary" data-close="taskModal">Batal</button><button class="primary" id="saveTask">Buat Tugas</button></div></div></div>
  <div class="modal-layer" id="readerModal"><div class="modal"><div class="modal-head"><h3>Status Dibaca</h3><button class="x" data-close="readerModal">✕</button></div><div id="readerContent"></div></div></div><div class="toast" id="toast"></div>
  <script>
  (function(){'use strict';
    var token='',bootstrap=null,currentRoom='',lastSequence=0,pendingFiles=[],poller=null,bootstrapLoading=false;
    function q(id){return document.getElementById(id)} function esc(v){return String(v||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
    function toast(message){q('toast').textContent=message;q('toast').classList.add('show');setTimeout(function(){q('toast').classList.remove('show')},2600)}
    function api(action,args){return window.BAKERZIN_API.call(action,args).then(function(r){if(!r||!r.ok)throw new Error(r&&r.error||'Server tidak merespons.');return r.data})}
    function session(){try{return localStorage.getItem('bakerzin_session')||''}catch(e){return ''}}
    function setBootstrapState(kind,title,message){var state=q('bootstrapState');state.className='bootstrap-state'+(kind==='error'?' error':kind==='hidden'?' hidden':'');q('bootstrapStateTitle').textContent=title;q('bootstrapStateMessage').textContent=message}
    function bootstrapErrorMessage(error){var message=String(error&&error.message||error||'');if(/Aksi API tidak diizinkan:\s*chatBootstrap/i.test(message))return 'Backend GAS utama belum memakai Code.gs terbaru. Selesaikan deployment backend, lalu tekan Coba Lagi.';if(/Database chat belum dapat diakses/i.test(message))return message;if(/tidak merespons|timeout|timed out/i.test(message))return 'Server membutuhkan waktu terlalu lama. Periksa deployment GAS utama lalu coba lagi.';return message||'Data grup belum dapat dimuat.'}
    function loadBootstrap(){if(bootstrapLoading)return;bootstrapLoading=true;q('userLabel').textContent='Menghubungkan akun...';q('createTask').disabled=true;setBootstrapState('loading','Menyiapkan pesan...','Menghubungkan akun dan database grup.');api('chatBootstrap',[token]).then(function(data){if(!data||!data.user)throw new Error('Data akun chat tidak lengkap.');if(!Array.isArray(data.rooms)||!data.rooms.length)throw new Error('Grup chat belum tersedia.');bootstrap=data;q('userLabel').textContent=data.user.name+' · '+data.user.outlet;q('createTask').disabled=false;setBootstrapState('hidden','','');renderRooms();renderTaskRoom();var requested=new URLSearchParams(location.search).get('room');if(requested)openRoom(requested)}).catch(function(error){var message=bootstrapErrorMessage(error);bootstrap=null;q('userLabel').textContent='Gagal memuat akun';q('rooms').innerHTML='';setBootstrapState('error','Grup belum dapat dimuat',message);q('messages').innerHTML='<div class="empty">'+esc(message)+'</div>'}).finally(function(){bootstrapLoading=false})}
    function init(){token=session();if(!token){document.body.innerHTML='<div class="empty">Sesi tidak ditemukan. Silakan login kembali ke BI-Space.</div>';return}loadBootstrap()}
    function renderRooms(){q('rooms').innerHTML=(bootstrap.rooms||[]).map(function(room){return '<button class="room'+(room.id===currentRoom?' active':'')+'" data-room="'+esc(room.id)+'"><span class="room-icon">'+(room.type==='GENERAL'?'G':esc(room.outlet||'O').slice(0,2))+'</span><span class="room-copy"><strong>'+esc(room.title)+'</strong><span>'+(room.type==='GENERAL'?'Semua pengguna aktif':'Grup khusus outlet')+'</span></span>'+(room.unread?'<span class="count">'+Math.min(99,room.unread)+'</span>':'')+'</button>'}).join('');Array.from(document.querySelectorAll('[data-room]')).forEach(function(b){b.onclick=function(){openRoom(b.dataset.room)}})}
    function openRoom(id){var room=(bootstrap.rooms||[]).filter(function(r){return r.id===id})[0];if(!room){toast('Grup tidak tersedia.');return}currentRoom=id;lastSequence=0;q('roomTitle').textContent=room.title;q('roomSubtitle').textContent=room.type==='GENERAL'?'Group semua pengguna · anggota dapat membalas':'Lingkup '+room.outlet;q('messageInput').disabled=false;q('send').disabled=false;q('side').classList.add('room-open');q('main').classList.add('room-open');renderRooms();renderPins();loadMessages();clearInterval(poller);poller=setInterval(refreshMessages,8000)}
    function renderPins(){var tasks=(bootstrap.tasks||[]).filter(function(t){return t.roomId===currentRoom});q('pins').classList.toggle('visible',tasks.length>0);q('pins').innerHTML=tasks.map(function(t){return '<article class="pin"><div class="pin-copy"><strong>'+esc(t.title)+'</strong><span>'+(t.dueAt?'Selesai sebelum '+new Date(t.dueAt).toLocaleString('id-ID'):'Tanpa batas waktu')+'</span></div><button data-complete="'+esc(t.id)+'">Selesai</button></article>'}).join('');Array.from(document.querySelectorAll('[data-complete]')).forEach(function(b){b.onclick=function(){if(confirm('Apakah Anda sudah menyelesaikan Tugas Ini?'))completeTask(b.dataset.complete)}})}
    function messageHtml(m){var mine=m.senderNik===bootstrap.user.nik,system=m.type==='SYSTEM';return '<article class="message '+(mine?'mine ':'')+(system?'system':'')+'"><div class="bubble">'+(!mine&&!system?'<div class="sender">'+esc(m.senderName)+' · '+esc(m.senderOutlet)+'</div>':'')+'<div class="text">'+esc(m.body)+'</div>'+(m.task?'<div class="task-card"><strong>📌 '+esc(m.task.title)+'</strong><span>'+esc(m.task.description||'Tugas grup')+'</span></div>':'')+(m.attachments&&m.attachments.length?'<div class="attachments">'+m.attachments.map(function(a){return '<button class="attachment" data-attachment="'+esc(a.id)+'">📎 <span>'+esc(a.name)+'<br><small>'+Math.ceil(a.size/1024)+' KB</small></span></button>'}).join('')+'</div>':'')+'<div class="meta"><span>'+new Date(m.createdAt).toLocaleString('id-ID',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+'</span>'+(mine&&!system?'<button class="read-link" data-readers="'+m.sequence+'">Info dibaca</button>':'')+'</div></div></article>'}
    function wireMessages(){Array.from(document.querySelectorAll('[data-readers]')).forEach(function(b){b.onclick=function(){showReaders(Number(b.dataset.readers))}});Array.from(document.querySelectorAll('[data-attachment]')).forEach(function(b){b.onclick=function(){downloadAttachment(b.dataset.attachment)}})}
    function loadMessages(){q('messages').innerHTML='<div class="empty">Memuat pesan...</div>';api('chatMessages',[token,currentRoom,0]).then(function(data){q('messages').innerHTML=data.messages.length?data.messages.map(messageHtml).join(''):'<div class="empty">Belum ada pesan. Jadilah yang pertama mengirim pesan di grup ini.</div>';lastSequence=data.latestSequence||0;wireMessages();markRead();q('messages').scrollTop=q('messages').scrollHeight}).catch(function(e){toast(e.message)})}
    function refreshMessages(){if(!currentRoom)return;api('chatMessages',[token,currentRoom,0]).then(function(data){if((data.latestSequence||0)===lastSequence)return;q('messages').innerHTML=data.messages.map(messageHtml).join('');lastSequence=data.latestSequence||0;wireMessages();markRead();q('messages').scrollTop=q('messages').scrollHeight;refreshBootstrap()}).catch(function(){})}
    function markRead(){if(lastSequence)api('chatMarkRead',[token,currentRoom,lastSequence]).catch(function(){})}
    function refreshBootstrap(){api('chatBootstrap',[token]).then(function(data){bootstrap=data;renderRooms();renderPins()}).catch(function(){})}
    function filesToPayload(files){return Promise.all(Array.from(files||[]).slice(0,5).map(function(file){return file.type.indexOf('image/')===0?compressImage(file):readFile(file)}))}
    function readFile(file){return new Promise(function(resolve,reject){if(file.size>5*1024*1024){reject(new Error(file.name+' lebih dari 5 MB.'));return}var r=new FileReader;r.onload=function(){resolve({fileName:file.name,mimeType:file.type||'application/octet-stream',base64:String(r.result).split(',')[1]})};r.onerror=reject;r.readAsDataURL(file)})}
    function compressImage(file){return new Promise(function(resolve,reject){var r=new FileReader;r.onload=function(){var img=new Image;img.onload=function(){var max=1600,scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);var data=canvas.toDataURL('image/jpeg',.75);resolve({fileName:file.name.replace(/\.[^.]+$/,'.jpg'),mimeType:'image/jpeg',base64:data.split(',')[1]})};img.onerror=reject;img.src=r.result};r.onerror=reject;r.readAsDataURL(file)})}
    function renderFileStrip(){q('fileStrip').classList.toggle('visible',pendingFiles.length>0);q('fileStrip').innerHTML=pendingFiles.map(function(f){return '<span class="file-chip">'+esc(f.name)+'</span>'}).join('')}
    q('files').onchange=function(){pendingFiles=Array.from(this.files||[]).slice(0,5);renderFileStrip()};q('attach').onclick=function(){q('files').click()};
    q('composer').onsubmit=function(e){e.preventDefault();var body=q('messageInput').value.trim();if(!body&&!pendingFiles.length)return;q('send').disabled=true;filesToPayload(pendingFiles).then(function(attachments){return api('chatSend',[token,{roomId:currentRoom,body:body,attachments:attachments}])}).then(function(){q('messageInput').value='';q('files').value='';pendingFiles=[];renderFileStrip();refreshMessages()}).catch(function(e){toast(e.message)}).finally(function(){q('send').disabled=false})};
    q('messageInput').onkeydown=function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();q('composer').requestSubmit()}};
    function renderTaskRoom(){q('taskRoom').innerHTML=(bootstrap.rooms||[]).map(function(r){return '<option value="'+esc(r.id)+'">'+esc(r.title)+'</option>'}).join('');renderTaskPicker()}
    function renderTaskPicker(){var room=q('taskRoom').value||'GENERAL',type=document.querySelector('[name=picType]:checked').value,outlet=room.indexOf('OUTLET:')===0?room.slice(7):'';q('pickerLabel').textContent=type==='OUTLET'?'PILIH OUTLET':'PILIH PERSON';var items=type==='OUTLET'?(outlet?[outlet]:(bootstrap.taskOutlets||bootstrap.outlets)):(bootstrap.people||[]).filter(function(p){return !outlet||p.outlet===outlet||p.outlet==='BIHQ'});q('taskPicker').innerHTML=items.map(function(item){var value=type==='OUTLET'?item:item.nik,label=type==='OUTLET'?item:item.name+' · '+item.outlet+' · '+item.position;return '<label class="pick"><input type="checkbox" value="'+esc(value)+'"> '+esc(label)+'</label>'}).join('')}
    q('createTask').onclick=function(){if(!bootstrap){loadBootstrap();return}q('taskModal').classList.add('open');q('taskRoom').value=currentRoom||'GENERAL';renderTaskPicker()};q('retryBootstrap').onclick=loadBootstrap;q('taskRoom').onchange=renderTaskPicker;Array.from(document.querySelectorAll('[name=picType]')).forEach(function(r){r.onchange=renderTaskPicker});
    q('saveTask').onclick=function(){var checked=Array.from(q('taskPicker').querySelectorAll('input:checked')).map(function(i){return i.value}),type=document.querySelector('[name=picType]:checked').value,payload={roomId:q('taskRoom').value,title:q('taskTitle').value.trim(),description:q('taskDescription').value.trim(),dueAt:q('taskDue').value,picType:type,outlets:type==='OUTLET'?checked:[],niks:type==='PERSON'?checked:[]};if(!payload.title||!checked.length){toast('Judul dan PIC wajib dipilih.');return}q('saveTask').disabled=true;filesToPayload(q('taskFiles').files).then(function(files){payload.attachments=files;return api('chatCreateTask',[token,payload])}).then(function(){q('taskModal').classList.remove('open');q('taskTitle').value='';q('taskDescription').value='';q('taskFiles').value='';toast('Tugas berhasil dibuat.');refreshBootstrap();if(currentRoom===payload.roomId)refreshMessages()}).catch(function(e){toast(e.message)}).finally(function(){q('saveTask').disabled=false})};
    function completeTask(id){api('chatCompleteTask',[token,id]).then(function(){toast('Tugas selesai.');refreshBootstrap();refreshMessages()}).catch(function(e){toast(e.message)})}
    function showReaders(sequence){q('readerModal').classList.add('open');q('readerContent').innerHTML='Memuat...';api('chatReaders',[token,currentRoom,sequence]).then(function(data){q('readerContent').innerHTML='<h4>Sudah membaca ('+data.seen.length+')</h4>'+data.seen.map(function(p){return '<p>✓ '+esc(p.name)+' · '+esc(p.outlet)+'</p>'}).join('')+'<h4>Belum membaca ('+data.unseen.length+')</h4>'+data.unseen.map(function(p){return '<p>○ '+esc(p.name)+' · '+esc(p.outlet)+'</p>'}).join('')}).catch(function(e){q('readerContent').textContent=e.message})}
    function downloadAttachment(id){toast('Menyiapkan lampiran...');api('chatAttachment',[token,id]).then(function(data){var bytes=atob(data.base64),arr=new Uint8Array(bytes.length);for(var i=0;i<bytes.length;i++)arr[i]=bytes.charCodeAt(i);var url=URL.createObjectURL(new Blob([arr],{type:data.mimeType})),a=document.createElement('a');a.href=url;a.download=data.name;a.click();setTimeout(function(){URL.revokeObjectURL(url)},1000)}).catch(function(e){toast(e.message)})}
    Array.from(document.querySelectorAll('[data-close]')).forEach(function(b){b.onclick=function(){q(b.dataset.close).classList.remove('open')}});q('back').onclick=function(){q('main').classList.remove('room-open');q('side').classList.remove('room-open')};q('close').onclick=function(){parent.postMessage({biChatClose:true},'*')};init();
  }());
  </script>
