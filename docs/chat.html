<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pesan · BI-Space</title>
</head>
<body>
<script>
(function(){
  var url = "https://raw.githubusercontent.com/operationalbi-pixel/form/fdbc72cb5fc844f28eef6bc2977feb94c966033e/docs/chat.html";
  fetch(url).then(function(r){return r.text()}).then(function(html){
    var oldCss = ".pins{display:none;padding:6px 14px;background:#fffdf5;border-bottom:1px solid #f2e4a9;gap:6px;overflow:auto}.pins.visible{display:flex}.pin{min-width:240px;max-width:360px;background:var(--yellow);border:1px solid #efd986;border-radius:10px;padding:5px 6px 5px 10px;display:flex;gap:8px;align-items:center}.pin-copy{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;border:0;background:transparent;padding:0;text-align:left;color:inherit;cursor:pointer;font:inherit}.pin strong{font-size:12px;line-height:1.25;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pin span{font-size:9px;line-height:1.2;color:#7e7045;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}";
    var newCss = ".pins{display:none;padding:6px 14px;background:#fff;border-bottom:1px solid var(--line);gap:6px;overflow:auto}.pins.visible{display:flex}.pin{min-width:240px;max-width:360px;background:transparent;border:0;border-radius:0;padding:5px 6px 5px 0;display:flex;gap:8px;align-items:center}.pin-copy{flex:1;min-width:0;display:flex;flex-direction:row;align-items:center;gap:8px;border:0;background:transparent;padding:0;text-align:left;color:inherit;cursor:pointer;font:inherit}.pin strong{font-size:12px;line-height:1.25;flex:1;min-width:0;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pin span{font-size:9px;line-height:1.2;color:#fff;background:var(--wine);padding:2px 6px;border-radius:6px;flex-shrink:0;white-space:nowrap}";
    if (html.indexOf(oldCss) !== -1) html = html.replace(oldCss, newCss);
    document.open();
    document.write(html);
    document.close();
  }).catch(function(e){
    document.body.innerHTML = "<p style=\"font-family:sans-serif;padding:24px\">Gagal memuat chat. Refresh atau hubungi admin.<br><small>"+e+"</small></p>";
  });
})();
</script>
</body>
</html>
