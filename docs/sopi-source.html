<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>SOPi · Dokumen SOP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="config.js"></script>
  <script src="api-client.js?v=20261001-sopi9"></script>
  <style>
    :root{--wine:#9d1530;--wine-dark:#6d0b20;--ink:#2e282a;--muted:#7f7377;--line:#e7dde0;--soft:#f8f5f6;--green:#16815a}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f5f2f3;color:var(--ink);font-family:"Plus Jakarta Sans","Segoe UI",sans-serif}button{font:inherit}
    .shell{width:min(940px,calc(100% - 28px));margin:24px auto 48px}.hero{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:25px 28px;border-radius:25px;color:#fff;background:linear-gradient(135deg,var(--wine-dark),var(--wine) 62%,#c72a48);box-shadow:0 18px 42px rgba(92,17,37,.18)}.hero:after{content:"";position:absolute;right:-55px;top:-80px;width:230px;height:230px;border-radius:50%;background:#ffffff0d}.brand{position:relative;z-index:1;display:flex;align-items:center;gap:15px}.avatar{width:58px;height:68px;display:grid;place-items:center;flex:0 0 auto}.avatar img{width:100%;height:100%;display:block;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 7px 9px #42061442)}.eyebrow{font-size:9px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;opacity:.72}.hero h1{margin:5px 0 0;font-size:clamp(22px,3.2vw,34px);letter-spacing:-.04em}.actions{position:relative;z-index:1;display:flex;gap:8px}.action{min-height:39px;padding:0 14px;border:1px solid #ffffff38;border-radius:12px;color:#fff;background:#ffffff15;font-size:10px;font-weight:800;cursor:pointer}.action:hover{background:#ffffff25}
    .meta{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:15px 0}.meta-card{min-height:76px;padding:14px;border:1px solid var(--line);border-radius:16px;background:#fff;box-shadow:0 6px 20px #3f202708}.meta-card span{display:block;color:#9b8e92;font-size:8px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.meta-card strong{display:block;margin-top:7px;font-size:11px;line-height:1.45}.legacy{border-color:#efc77d;background:#fff9eb;color:#85550b}.final-photo{margin:0 0 15px;padding:10px;border:1px solid var(--line);border-radius:20px;background:#fff;box-shadow:0 8px 25px #3f202708}.final-photo img{display:block;width:100%;max-height:520px;border-radius:14px;object-fit:contain;background:var(--soft)}.final-photo figcaption{padding:9px 4px 1px;color:var(--muted);font-size:9px;font-weight:700}.content{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:15px}.card{padding:22px;border:1px solid var(--line);border-radius:20px;background:#fff;box-shadow:0 8px 25px #3f202708}.card h2{margin:0 0 17px;font-size:15px;letter-spacing:-.025em}.ingredients{display:grid;gap:8px}.ingredient{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;padding:11px 12px;border-radius:12px;background:var(--soft);font-size:10px;line-height:1.5}.ingredient strong{font-weight:700}.ingredient span{color:var(--wine);font-weight:800;white-space:nowrap}.steps{display:grid;gap:12px;counter-reset:step}.step{position:relative;padding:3px 0 13px 42px;border-bottom:1px solid #eee6e8;font-size:10px;line-height:1.7}.step:last-child{border-bottom:0;padding-bottom:0}.step:before{counter-increment:step;content:counter(step);position:absolute;left:0;top:0;width:28px;height:28px;display:grid;place-items:center;border-radius:9px;color:#fff;background:linear-gradient(145deg,var(--wine-dark),var(--wine));font-size:9px;font-weight:800}.step img{display:block;width:100%;max-height:360px;margin:10px 0 3px;border-radius:12px;object-fit:contain;background:var(--soft)}.additional{margin-top:15px}.additional p{margin:0;color:#554b4f;font-size:10px;line-height:1.75;white-space:pre-wrap}.empty,.loading{padding:70px 20px;text-align:center;color:var(--muted);font-size:11px}.error{color:#98203a}.download{display:none;border-color:#fee6eb;background:#fff;color:var(--wine)}
    @media(max-width:760px){.shell{width:100%;margin:0}.hero{border-radius:0;padding:calc(20px + max(env(safe-area-inset-top),28px)) 16px 20px}.actions{flex-direction:column}.action{min-height:34px;padding:0 10px}.meta{grid-template-columns:repeat(2,minmax(0,1fr));padding:0 12px}.final-photo{margin:0 12px 15px}.content{grid-template-columns:1fr;padding:0 12px 24px}.card{padding:17px}.avatar{width:48px;height:58px}}
    @media print{body{background:#fff}.shell{width:100%;margin:0}.actions{display:none}.hero,.meta-card,.card{box-shadow:none}.hero{print-color-adjust:exact;-webkit-print-color-adjust:exact}.content{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
  <main class="shell" id="app"><div class="card loading">Menyiapkan tampilan SOP...</div></main>
  <script>
    (function(){
      'use strict';
      var token='';try{token=localStorage.getItem('bakerzin_session')||''}catch(e){}
      var id='';try{id=new URLSearchParams(location.search).get('id')||''}catch(e){}
      var app=document.getElementById('app');
      function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
      function avatar(){return '<span class="avatar"><img src="assets/sopi-assistant-v2.png?v=20261001-sopi9" alt="SOPi"></span>'}
      function meta(label,value,extra){return '<div class="meta-card '+(extra||'')+'"><span>'+esc(label)+'</span><strong>'+esc(value||'-')+'</strong></div>'}
      function render(data){var ingredients=Array.isArray(data.ingredients)?data.ingredients:[],steps=Array.isArray(data.steps)?data.steps:[],finalPhoto=data.finalImageUrl?'<figure class="final-photo"><img src="'+esc(data.finalImageUrl)+'" alt="Tampilan akhir '+esc(data.title||'menu')+'"><figcaption>Tampilan akhir menu</figcaption></figure>':'';document.title=(data.title||'Dokumen SOP')+' · SOPi';app.innerHTML='<header class="hero"><div class="brand">'+avatar()+'<div><div class="eyebrow">SOPi · Dokumen Terverifikasi</div><h1>'+esc(data.title||'Dokumen SOP')+'</h1></div></div><div class="actions"><button class="action download" id="download" type="button">Unduh '+esc(data.fileName||'Lampiran')+'</button><button class="action" type="button" onclick="window.print()">Cetak</button></div></header><section class="meta">'+meta('Kategori',data.category)+meta('Detail',data.categoryDetail)+meta('Efektif',data.effectiveDate)+meta('Revisi',data.revision)+meta(data.isLegacy?'Status sumber':'Yield',data.isLegacy?'Arsip lama':data.yieldText,data.isLegacy?'legacy':'')+'</section>'+finalPhoto+'<section class="content"><article class="card"><h2>Bahan & Takaran</h2><div class="ingredients">'+(ingredients.length?ingredients.map(function(item){return '<div class="ingredient"><strong>'+esc(item.name)+'</strong><span>'+esc([item.qty,item.uom].filter(Boolean).join(' '))+'</span></div>'}).join(''):'<div class="empty">Bahan tidak dicantumkan pada sumber.</div>')+'</div>'+(data.shelfLife?'<div class="additional"><h2>Shelf Life</h2><p>'+esc(data.shelfLife)+'</p></div>':'')+'</article><article class="card"><h2>Metode Pembuatan</h2><div class="steps">'+(steps.length?steps.map(function(item){return '<div class="step">'+esc(item.desc)+(item.imageUrl?'<img loading="lazy" src="'+esc(item.imageUrl)+'" alt="Foto langkah pembuatan">':'')+'</div>'}).join(''):'<div class="empty">Metode tidak dicantumkan pada sumber.</div>')+'</div>'+(data.contentText?'<div class="additional"><h2>Informasi Tambahan</h2><p>'+esc(data.contentText)+'</p></div>':'')+'</article></section>';if(data.fileId){var button=document.getElementById('download');button.style.display='block';button.addEventListener('click',function(){download(data.fileId,button)})}}
      function download(fileId,button){var original=button.textContent;button.disabled=true;button.textContent='Menyiapkan...';window.BAKERZIN_API.call('sopiDownload',[token,fileId]).then(function(response){if(!response||!response.ok)throw new Error(response&&response.error||'File tidak dapat diunduh.');var data=response.data||{},binary=atob(String(data.base64||'')),bytes=new Uint8Array(binary.length);for(var i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);var url=URL.createObjectURL(new Blob([bytes],{type:data.mimeType||'application/octet-stream'})),link=document.createElement('a');link.href=url;link.download=data.fileName||'lampiran';document.body.appendChild(link);link.click();link.remove();setTimeout(function(){URL.revokeObjectURL(url)},1500)}).catch(function(error){alert(error.message||'File tidak dapat diunduh.')}).finally(function(){button.disabled=false;button.textContent=original})}
      if(!token||!id){app.innerHTML='<div class="card empty error">Sesi atau dokumen tidak valid. Silakan buka kembali dari SOPi.</div>';return}
      window.BAKERZIN_API.call('sopiDocument',[token,id]).then(function(response){if(!response||!response.ok)throw new Error(response&&response.error||'Dokumen tidak dapat dimuat.');render(response.data||{})}).catch(function(error){app.innerHTML='<div class="card empty error">'+esc(error.message||'Dokumen tidak dapat dimuat.')+'</div>'});
    }());
  </script>
</body>
</html>
