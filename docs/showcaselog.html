<!DOCTYPE html>
<html lang="id">
<head>
  <base target="_self">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Showcase Log</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="ui-modern.css">
  <script src="config.js"></script>
  <script src="api-client.js"></script>
  <style>
    :root{--red:#b91e37;--red2:#ef3152;--ink:#30292b;--muted:#7d7376;--line:#e9e2e4;--soft:#f8f6f6;--green:#18a969;--shadow:0 14px 42px rgba(54,35,40,.09)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Plus Jakarta Sans","Segoe UI",Arial,sans-serif;color:var(--ink);background:var(--soft)}button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}
    .topbar{position:sticky;top:0;z-index:30;border-bottom:1px solid var(--line);background:rgba(255,255,255,.96);backdrop-filter:blur(16px);box-shadow:0 8px 28px rgba(54,35,40,.05)}
    .topbar-inner{width:min(100%,1500px);min-height:74px;margin:auto;padding:12px 24px;display:grid;grid-template-columns:minmax(180px,1fr) auto minmax(180px,1fr);align-items:center;gap:18px}
    .title-wrap{display:flex;align-items:center;gap:12px;min-width:0}.page-mark{width:40px;height:40px;display:grid;place-items:center;flex:0 0 40px;border-radius:13px;color:#fff;background:linear-gradient(145deg,var(--red2),var(--red));box-shadow:0 9px 22px rgba(185,30,55,.22);font-weight:800}.title-wrap h1{margin:0;font-size:18px;letter-spacing:-.025em}.title-wrap span{display:block;margin-top:3px;color:var(--muted);font-size:9px}
    .date-field{display:grid;gap:5px}.date-field label{text-align:center;color:var(--muted);font-size:8px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}.date-field input{height:40px;padding:0 12px;border:1px solid var(--line);border-radius:11px;color:var(--ink);background:#fff;outline:0}.date-field input:focus{border-color:var(--red);box-shadow:0 0 0 4px rgba(185,30,55,.08)}
    .top-actions{display:flex;justify-content:flex-end;gap:9px}.icon-button,.save-button{height:42px;border-radius:12px;transition:.18s}.icon-button{width:42px;display:grid;place-items:center;border:1px solid var(--line);color:var(--ink);background:#fff}.icon-button:hover{color:var(--red);transform:translateY(-1px)}.icon-button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.save-button{min-width:112px;border:0;padding:0 20px;color:#fff;background:linear-gradient(135deg,var(--red),var(--red2));box-shadow:0 9px 22px rgba(185,30,55,.22);font-size:11px;font-weight:800}.save-button:hover{transform:translateY(-1px);box-shadow:0 12px 26px rgba(185,30,55,.29)}.save-button:disabled{cursor:not-allowed;opacity:.5;transform:none;box-shadow:none}
    .container{width:min(100%,1500px);margin:auto;padding:24px}
    .progress-card{margin-bottom:18px;padding:17px 18px;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:0 8px 28px rgba(54,35,40,.04);overflow:auto}.progress-title{margin:0 0 13px;font-size:13px}.progress-grid{--days:31;min-width:940px;display:grid;grid-template-columns:170px repeat(var(--days),minmax(17px,1fr));gap:7px;align-items:center}.progress-label{font-size:9px;font-weight:700}.progress-date{text-align:center;color:#8a7f82;font-size:7px}.progress-day{height:8px;border:1px solid #e5dfe0;border-radius:8px;background:#f1edef}.progress-day.done{border-color:#18a969;background:#20b875}.progress-day.missing{border-color:#c8213f;background:#cf2946}.progress-day.future{border-color:#e8e3e4;background:#f3f0f1}.progress-day.today{box-shadow:0 0 0 2px #fff,0 0 0 3px #95898d}
    .table-card{border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:var(--shadow);overflow:hidden}.table-wrap{overflow:auto}.log-table{width:100%;border-collapse:collapse;table-layout:fixed}.log-table th{padding:11px 9px;border-bottom:1px solid var(--line);color:#756b6e;background:#faf8f8;font-size:8px;font-weight:800;letter-spacing:.08em;text-align:center;text-transform:uppercase}.log-table thead tr:first-child th{padding-top:14px;padding-bottom:8px}.log-table th.item-head{text-align:left;width:31%}.log-table th.balance-head{width:9%}.log-table td{padding:12px 9px;border-bottom:1px solid #f0ebec;text-align:center;font-size:11px}.log-table tbody tr:last-child td{border-bottom:0}.log-table tbody tr:hover{background:#fdfafa}.item-cell{text-align:left!important}.item-cell strong{display:block;font-size:11px}.item-cell span{display:block;margin-top:4px;color:var(--muted);font-size:8px}.total{color:#544b4e;font-size:12px;font-weight:700}.balance{font-size:13px;font-weight:800}.balance.negative{color:var(--red)}.qty-input{width:100%;min-width:64px;height:38px;padding:0 8px;border:1px solid #ddd5d7;border-radius:10px;color:var(--ink);background:#fff;text-align:center;outline:0}.qty-input:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(185,30,55,.08)}.qty-input:not(:placeholder-shown){background:#fff7f8;border-color:#df9eaa}
    .loading,.empty{padding:70px 20px;text-align:center;color:var(--muted);font-size:12px}.skeleton{display:block;height:12px;border-radius:8px;background:linear-gradient(90deg,#f0ebec 25%,#faf8f8 40%,#f0ebec 65%);background-size:300% 100%;animation:shine 1.2s infinite}.toast{position:fixed;right:20px;bottom:20px;z-index:80;max-width:min(390px,calc(100vw - 40px));padding:13px 16px;border-radius:12px;color:#fff;background:#30292b;box-shadow:0 16px 38px rgba(30,20,23,.22);font-size:11px;line-height:1.5;opacity:0;transform:translateY(18px);pointer-events:none;transition:.22s}.toast.show{opacity:1;transform:none}.toast.error{background:#a71932}
    @keyframes shine{to{background-position:-300% 0}}
    @media(max-width:760px){.topbar-inner{min-height:auto;padding:11px 14px;grid-template-columns:1fr auto;gap:11px}.title-wrap{grid-column:1}.title-wrap span{display:none}.title-wrap h1{font-size:16px}.page-mark{width:36px;height:36px;flex-basis:36px}.date-field{grid-column:1;grid-row:2;align-items:center;grid-template-columns:auto minmax(0,1fr)}.date-field label{text-align:left}.date-field input{width:100%;height:38px}.top-actions{grid-column:2;grid-row:1/3;align-self:stretch;display:grid;grid-template-columns:42px 1fr}.save-button{min-width:78px;padding:0 12px}.container{padding:14px}.progress-card{padding:14px;margin-bottom:13px;border-radius:15px}.progress-title{font-size:12px}.table-card{overflow:visible;border:0;background:transparent;box-shadow:none}.table-wrap{overflow:visible}.log-table,.log-table tbody{display:block}.log-table thead{display:none}.log-table tr{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:11px;padding:14px;border:1px solid var(--line);border-radius:15px;background:#fff;box-shadow:0 7px 22px rgba(54,35,40,.05)}.log-table td{display:block;padding:0;border:0;text-align:left}.log-table .item-cell{grid-column:1/3}.log-table .balance-cell{grid-column:3;text-align:right}.log-table .metric-total,.log-table .metric-input{grid-row:auto}.log-table .metric-total{padding:8px 9px;border-radius:9px;background:#f8f5f5}.log-table .metric-total:before,.log-table .metric-input:before{display:block;margin-bottom:5px;color:#8b7f82;font-size:7px;font-weight:800;letter-spacing:.07em;text-transform:uppercase}.log-table td[data-kind="in-total"]:before{content:'In · Total'}.log-table td[data-kind="sold-total"]:before{content:'Sold · Total'}.log-table td[data-kind="waste-total"]:before{content:'Waste · Total'}.log-table td[data-kind="in-input"]:before{content:'In · Input'}.log-table td[data-kind="sold-input"]:before{content:'Sold · Input'}.log-table td[data-kind="waste-input"]:before{content:'Waste · Input'}.qty-input{min-width:0}.progress-grid{min-width:900px}}
    @media(max-width:430px){.title-wrap h1{font-size:14px}.save-button{min-width:68px}.log-table tr{gap:8px;padding:12px}.item-cell strong{font-size:10px}.qty-input{height:36px;padding:0 5px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="title-wrap"><div class="page-mark">S</div><div><h1>Showcase Log</h1><span>Daily Stock Movement</span></div></div>
      <label class="date-field"><span>Tanggal</span><input id="eventDate" type="date"></label>
      <div class="top-actions">
        <button class="icon-button" type="button" onclick="backToDashboard()" title="Back to Dashboard" aria-label="Back to Dashboard"><svg viewBox="0 0 24 24"><path d="M10 17l-5-5 5-5"></path><path d="M5 12h11"></path><path d="M14 4h5v16h-5"></path></svg></button>
        <button id="saveButton" class="save-button" type="button">Simpan</button>
      </div>
    </div>
  </header>
  <main class="container">
    <section class="progress-card"><h2 class="progress-title">Progress Showcase Harian</h2><div id="progressGrid" class="progress-grid"><div class="loading">Memuat progress...</div></div></section>
    <section class="table-card">
      <div class="table-wrap">
        <table class="log-table">
          <thead><tr><th class="item-head" rowspan="2">Item Showcase</th><th colspan="2">In</th><th colspan="2">Sold</th><th colspan="2">Waste</th><th class="balance-head" rowspan="2">Balance</th></tr><tr><th>Total</th><th>Input</th><th>Total</th><th>Input</th><th>Total</th><th>Input</th></tr></thead>
          <tbody id="itemRows"><tr><td colspan="8" class="loading">Memuat item Showcase...</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>
  <div id="toast" class="toast"></div>
  <script>
    var STATE={token:readToken(),outlet:readOutlet(),items:[],progress:null,saving:false};
    function byId(id){return document.getElementById(id)}
    function readToken(){try{return localStorage.getItem('bakerzin_session')||''}catch(error){return''}}
    function readOutlet(){try{return localStorage.getItem('bakerzin_selected_outlet')||''}catch(error){return''}}
    function siteBase(){var configured=window.BAKERZIN_CONFIG&&window.BAKERZIN_CONFIG.SITE_BASE_URL;if(configured)return String(configured).replace(/\/?$/,'/');return location.href.replace(/[^/?#]+(?:[?#].*)?$/,'')}
    function today(){var d=new Date(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return d.getFullYear()+'-'+m+'-'+day}
    function call(name,args,success){BAKERZIN_API.call(name,args).then(function(result){if(!result||!result.ok)throw new Error(result&&result.error?result.error:'Terjadi kesalahan.');success(result.data)}).catch(function(error){toast(error.message||'Tidak dapat terhubung ke server.',true);setSaving(false)})}
    function escapeHtml(value){return String(value||'').replace(/[&<>"']/g,function(char){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]})}
    function escapeAttr(value){return escapeHtml(value).replace(/`/g,'&#96;')}
    function formatQty(value){return Number(value||0).toLocaleString('id-ID',{maximumFractionDigits:3})}
    function toast(message,error){var el=byId('toast');el.textContent=message;el.className='toast show'+(error?' error':'');clearTimeout(toast.timer);toast.timer=setTimeout(function(){el.className='toast'},4200)}
    function backToDashboard(){window.top.location.href=siteBase()+'index.html'}
    function setSaving(value){STATE.saving=value;byId('saveButton').disabled=value;byId('saveButton').textContent=value?'Menyimpan...':'Simpan';document.querySelectorAll('.qty-input').forEach(function(input){input.disabled=value})}
    function load(){if(!STATE.token){toast('Sesi login tidak ditemukan. Silakan kembali ke Dashboard.',true);return}var date=byId('eventDate').value||today();byId('itemRows').innerHTML='<tr><td colspan="8" class="loading">Memuat item Showcase...</td></tr>';call('showcaseLogBootstrap',[STATE.token,STATE.outlet,date],function(data){STATE.outlet=data.selectedOutlet;STATE.items=data.items||[];STATE.progress=data.progress;try{localStorage.setItem('bakerzin_selected_outlet',STATE.outlet)}catch(error){}renderItems();renderProgress()})}
    function renderItems(){var body=byId('itemRows');if(!STATE.items.length){body.innerHTML='<tr><td colspan="8" class="empty">Item Showcase belum tersedia.</td></tr>';return}body.innerHTML=STATE.items.map(function(item,index){var negative=Number(item.balance)<0;return '<tr><td class="item-cell"><strong>'+escapeHtml(item.name)+'</strong><span>'+escapeHtml(item.category)+' · '+escapeHtml(item.code)+'</span></td><td class="metric-total total" data-kind="in-total" id="inTotal'+index+'">'+formatQty(item.totalIn)+'</td><td class="metric-input" data-kind="in-input"><input class="qty-input" data-index="'+index+'" data-field="inQty" type="number" min="0" step="0.001" inputmode="decimal" placeholder=""></td><td class="metric-total total" data-kind="sold-total" id="soldTotal'+index+'">'+formatQty(item.totalSold)+'</td><td class="metric-input" data-kind="sold-input"><input class="qty-input" data-index="'+index+'" data-field="soldQty" type="number" min="0" step="0.001" inputmode="decimal" placeholder=""></td><td class="metric-total total" data-kind="waste-total" id="wasteTotal'+index+'">'+formatQty(item.totalWaste)+'</td><td class="metric-input" data-kind="waste-input"><input class="qty-input" data-index="'+index+'" data-field="wasteQty" type="number" min="0" step="0.001" inputmode="decimal" placeholder=""></td><td class="balance-cell"><span id="balance'+index+'" class="balance '+(negative?'negative':'')+'">'+formatQty(item.balance)+'</span></td></tr>'}).join('')}
    function renderProgress(){var progress=STATE.progress||{},days=progress.days||[],grid=byId('progressGrid');if(!days.length){grid.innerHTML='<div class="loading">Progress belum tersedia.</div>';return}grid.style.setProperty('--days',days.length);var rows=[{label:'Stock In',key:'stockIn'},{label:'Sold',key:'sold'},{label:'Waste',key:'waste'}],html='<div class="progress-label">Tanggal</div>';html+=days.map(function(day){return'<div class="progress-date">'+day.day+'</div>'}).join('');rows.forEach(function(row){html+='<div class="progress-label">'+row.label+'</div>';html+=days.map(function(day){var done=Boolean(day[row.key]),state=day.future?'future':done?'done':'missing';return'<div class="progress-day '+state+' '+(day.date===progress.selectedDate?'today':'')+'" title="'+escapeAttr(row.label+' · '+day.date+' · '+(done?'Selesai':'Belum'))+'"></div>'}).join('')});grid.innerHTML=html}
    function collectEntries(){var entries={};document.querySelectorAll('.qty-input').forEach(function(input){var value=input.value.trim();if(value==='')return;var qty=Number(value);if(!isFinite(qty)||qty<0)return;var index=Number(input.dataset.index),item=STATE.items[index],flag=input.dataset.field==='inQty'?'hasInInput':input.dataset.field==='soldQty'?'hasSoldInput':'hasWasteInput';if(!entries[index])entries[index]={itemCode:item.code,inQty:0,soldQty:0,wasteQty:0,hasInInput:false,hasSoldInput:false,hasWasteInput:false};entries[index][input.dataset.field]=qty;entries[index][flag]=true});return Object.keys(entries).map(function(index){return entries[index]}).filter(function(entry){return entry.hasInInput||entry.hasSoldInput||entry.hasWasteInput})}
    function save(){if(STATE.saving)return;var entries=collectEntries();if(!entries.length){toast('Isi minimal satu kolom In, Sold, atau Waste.',true);return}setSaving(true);call('saveShowcaseLog',[STATE.token,{outlet:STATE.outlet,eventDate:byId('eventDate').value,entries:entries}],function(data){(data.entries||[]).forEach(function(saved){var index=STATE.items.findIndex(function(item){return item.code===saved.itemCode});if(index<0)return;var item=STATE.items[index];item.totalIn+=Number(saved.inQty||0);item.totalSold+=Number(saved.soldQty||0);item.totalWaste+=Number(saved.wasteQty||0);item.balance+=Number(saved.inQty||0)-Number(saved.soldQty||0)-Number(saved.wasteQty||0)});STATE.progress=data.progress;renderItems();renderProgress();setSaving(false);toast(data.completed?'Showcase Log tersimpan. Daily hari ini selesai.':'Showcase Log tersimpan. Lengkapi In, Sold, dan Waste untuk menyelesaikan Daily.')})}
    byId('eventDate').value=today();byId('eventDate').max=today();byId('eventDate').addEventListener('change',load);byId('saveButton').addEventListener('click',save);load();
  </script>
</body>
</html>
