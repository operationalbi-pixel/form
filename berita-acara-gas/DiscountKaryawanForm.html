            <input type="file" id="fileBill" accept="image/*" class="w-full text-xs" onchange="previewSingle(this, 'previewBillBox')">
            
            <!-- Container Preview -->
            <div id="previewBillBox" class="hidden mt-3 w-full h-48 bg-white border rounded flex items-center justify-center overflow-hidden relative shadow-sm">

        <div class="mt-8">

                SIMPAN & KIRIM PENGAJUAN
            </button>

<script>
    // --- Utilities ---
    window.formatRupiah = (num) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(num);
    window.parseRupiah = (str) => parseFloat(str.replace(/[^0-9,-]+/g,"").replace(",", ".")) || 0;

    // --- Preview Image Logic ---
    window.previewSingle = function(input, targetId) {
        const target = document.getElementById(targetId);
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                target.innerHTML = `<img src="${e.target.result}" class="h-full w-auto object-contain">`;
                target.classList.remove('hidden');
            }
            reader.readAsDataURL(input.files[0]);
        } else {
            target.innerHTML = '';
            target.classList.add('hidden');
        }
    };

    // --- Helper Get File Base64 ---
    window.getFileBase64 = async function(inputId) {
        const input = document.getElementById(inputId);
        if (!input || input.files.length === 0) return null;
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = reject;
            reader.readAsDataURL(input.files[0]);
        });
    };

    (function() {
        // 1. Populate User Data
        const user = window.GLOBAL_USER;
        if(user) {
            document.getElementById('u_nama').value = user.NAME || '';
            document.getElementById('u_nik').value = user.NIK || '';
            document.getElementById('u_outlet').value = user.OUTLET || '';
            document.getElementById('u_posisi').value = user.POSITION || '';
        }

        // 2. Format Currency Live
        ['totalBillInput', 'nominalDiskonInput'].forEach(id => {
            document.getElementById(id).addEventListener('keyup', function(e) {
                const val = window.parseRupiah(this.value);
                this.value = window.formatRupiah(val).replace('Rp', '').trim();
            });
        });

        // 3. Handle Submit
        const form = document.getElementById('discKaryawanForm');
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = form.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;
            btn.disabled = true; btn.innerHTML = 'Mengirim Data...';

            try {
                // Get File Data First
                const fotoBillData = await window.getFileBase64('fileBill');
                if(!fotoBillData) {
                    throw new Error("Mohon upload Foto Bill terlebih dahulu.");
                }

                const formData = {
                    tanggalBill: form.querySelector('[name="tanggalBill"]').value,
                    noBill: form.querySelector('[name="noBill"]').value,
                    totalBill: form.querySelector('[name="totalBill"]').value,
                    nominalDiskon: form.querySelector('[name="nominalDiskon"]').value,
                    idKaryawan: form.querySelector('[name="idKaryawan"]').value,
                    namaKaryawan: form.querySelector('[name="namaKaryawan"]').value,
                    keterangan: form.querySelector('[name="keterangan"]').value,
                    // File Mapping
                    fotoBill: fotoBillData
                };

                // Send to Backend
                // PASTIKAN: Di Code.gs, tipe 'Discount Karyawan' dimasukkan ke dalam list flow AM ONLY
                google.script.run.withSuccessHandler(res => {
                    if(res.success) { 
                        alert("Sukses! Berita Acara Diskon Karyawan Terkirim. ID: " + res.baId); 
                        if(typeof closeForm === 'function') closeForm(); 
                    } else { 
                        throw new Error(res.message);
                    }
                }).withFailureHandler(err => {
                    throw err;
                }).rekamData(formData, 'Discount Karyawan', window.GLOBAL_USER);

            } catch (error) {
                alert("Error: " + error.message);
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        });

    })();
</script>
