        <button type="button" id="btnAddRow" class="text-xs font-bold text-white bg-amber-500 hover:bg-amber-600 px-4 py-2 rounded shadow flex items-center transition transform active:scale-95">

        <!-- 5. Upload Bukti dengan Preview -->
        <div class="space-y-4 pt-6 border-t mt-6">

                    <label class="block text-xs font-bold text-gray-500 uppercase">1. Foto Sebelum Void</label>
                    <div class="relative group">
                        <input type="file" accept="image/*" class="file-input w-full text-xs p-2 border rounded cursor-pointer bg-gray-50 hover:bg-gray-100 transition" data-key="fotoSebelum" onchange="previewImage(this, 'preview1')">
                    </div>
                    <div id="preview1" class="hidden mt-2 w-full h-32 bg-gray-100 rounded border border-gray-200 flex items-center justify-center overflow-hidden"></div>
                </div>

                    <label class="block text-xs font-bold text-gray-500 uppercase">2. Foto Setelah Void</label>

                        <input type="file" accept="image/*" class="file-input w-full text-xs p-2 border rounded cursor-pointer bg-gray-50 hover:bg-gray-100 transition" data-key="fotoSesudah" onchange="previewImage(this, 'preview2')">
                    </div>
                    <div id="preview2" class="hidden mt-2 w-full h-32 bg-gray-100 rounded border border-gray-200 flex items-center justify-center overflow-hidden"></div>
                </div>
                <div class="space-y-2">
                    <label class="block text-xs font-bold text-gray-500 uppercase">3. Foto Struk Void</label>
                    <div class="relative group">
                        <input type="file" accept="image/*" class="file-input w-full text-xs p-2 border rounded cursor-pointer bg-gray-50 hover:bg-gray-100 transition" data-key="fotoStruk" onchange="previewImage(this, 'preview3')">
                    </div>
                    <div id="preview3" class="hidden mt-2 w-full h-32 bg-gray-100 rounded border border-gray-200 flex items-center justify-center overflow-hidden"></div>

        <div class="mt-8">

                SIMPAN & KIRIM
            </button>

<script>
    // --- Helper Functions (Global Scope) ---
    window.formatRupiah = (num) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(num);
    window.parseRupiah = (str) => parseFloat(str.replace(/[^0-9,-]+/g,"").replace(",", ".")) || 0;

    // --- Preview Logic ---
    window.previewImage = function(input, previewId) {
        const previewDiv = document.getElementById(previewId);
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                previewDiv.innerHTML = `<img src="${e.target.result}" class="w-full h-full object-cover">`;
                previewDiv.classList.remove('hidden');
            }
            reader.readAsDataURL(input.files[0]);
        } else {
            previewDiv.classList.add('hidden');
        }
    };

    // --- Main Logic (Immediately Invoked Function) ---
    (function() {
        // 1. Load User Data Otomatis
        // Ambil dari variable window.GLOBAL_USER yang di-inject di baris 1
        const user = window.GLOBAL_USER;
        if (user) {
            document.getElementById('v_nama').value = user.NAME || '';
            document.getElementById('v_nik').value = user.NIK || '';
            document.getElementById('v_outlet').value = user.OUTLET || '';
            document.getElementById('v_posisi').value = user.POSITION || '';
        } else {
            console.error("User data not found in GLOBAL_USER");
        }

        // 2. Tanggal & Hari Listener
        const dateInput = document.getElementById('dateInput');
        if(dateInput) {
            dateInput.addEventListener('change', function() {
                const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
                const d = new Date(this.value);
                if(!isNaN(d.getTime())) {
                    document.getElementById('dayOutput').value = days[d.getDay()];
                }
            });
        }

        // 3. Tabel Logic
        window.addVoidRow = function() {
            const tbody = document.getElementById('itemContainer');
            const rowCount = tbody.rows.length + 1;
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="py-2 px-3 text-center text-gray-500 align-middle">${rowCount}</td>
                <td class="py-2 px-3"><input type="text" class="w-full border-b border-gray-300 outline-none py-1 focus:border-red-800 bg-transparent" placeholder="Menu" required></td>
                <td class="py-2 px-3"><input type="number" class="w-full text-center border-b border-gray-300 outline-none py-1 focus:border-red-800 qty-input bg-transparent" value="1" min="1" required></td>
                <td class="py-2 px-3"><input type="text" class="w-full text-right border-b border-gray-300 outline-none py-1 focus:border-red-800 price-input bg-transparent" placeholder="0" required></td>
                <td class="py-2 px-3 text-right font-medium text-gray-700 total-cell">Rp 0</td>
                <td class="py-2 px-3 text-center"><button type="button" onclick="this.closest('tr').remove(); window.recalcTotal();" class="text-red-500 font-bold text-lg">×</button></td>
            `;
            tbody.appendChild(tr);
            
            const qty = tr.querySelector('.qty-input');
            const price = tr.querySelector('.price-input');
            
            price.addEventListener('keyup', function(e) {
                const val = window.parseRupiah(this.value);
                this.value = window.formatRupiah(val).replace('Rp', '').trim();
                window.calcRow(tr);
            });
            qty.addEventListener('input', () => window.calcRow(tr));
        };

        window.calcRow = function(tr) {
            const qty = parseFloat(tr.querySelector('.qty-input').value) || 0;
            const price = window.parseRupiah(tr.querySelector('.price-input').value);
            const total = qty * price;
            tr.querySelector('.total-cell').textContent = window.formatRupiah(total);
            tr.dataset.total = total;
            window.recalcTotal();
        };

        window.recalcTotal = function() {
            let grand = 0;
            document.querySelectorAll('#itemContainer tr').forEach(tr => {
                grand += parseFloat(tr.dataset.total) || 0;
            });
            document.getElementById('grandTotal').textContent = window.formatRupiah(grand);
            // Renumbering
            document.querySelectorAll('#itemContainer tr').forEach((tr, index) => {
                tr.querySelector('td:first-child').textContent = index + 1;
            });
        };

        // Attach Add Button
        document.getElementById('btnAddRow').addEventListener('click', window.addVoidRow);
        
        // Init First Row
        window.addVoidRow();

        // 4. Submit Handler
        const form = document.getElementById('voidForm');
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = form.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;
            btn.disabled = true; btn.innerHTML = 'Memproses...';

            const items = [];
            document.querySelectorAll('#itemContainer tr').forEach(tr => {
                items.push({
                    item: tr.querySelector('input[type="text"]').value,
                    qty: tr.querySelector('.qty-input').value,
                    price: tr.querySelector('.price-input').value,
                    total: tr.querySelector('.total-cell').textContent
                });
            });

            const formData = {
                tanggal: form.querySelector('[name="tanggal"]').value,
                hari: form.querySelector('[name="hari"]').value,
                noBill: form.querySelector('[name="noBill"]').value,
                alasan: form.querySelector('[name="alasan"]').value,
                items: items,
                grandTotal: document.getElementById('grandTotal').textContent,
                fotoSebelum: null, fotoSesudah: null, fotoStruk: null
            };

            const fileInputs = document.querySelectorAll('.file-input');
            const filePromises = Array.from(fileInputs).map(input => {
                return new Promise((resolve) => {
                    if (input.files.length > 0) {
                        const reader = new FileReader();
                        reader.onload = (e) => resolve({ key: input.dataset.key, data: e.target.result });
                        reader.readAsDataURL(input.files[0]);
                    } else {
                        resolve({ key: input.dataset.key, data: null });
                    }
                });
            });

            const files = await Promise.all(filePromises);
            files.forEach(f => formData[f.key] = f.data);

            google.script.run.withSuccessHandler(res => {
                if(res.success) { alert("Sukses! ID: " + res.baId); closeForm(); }
                else { alert("Gagal: " + res.message); btn.disabled = false; btn.innerHTML = originalText; }
            }).rekamData(formData, 'Void', window.GLOBAL_USER);
        });

    })(); // End IIFE
</script>
