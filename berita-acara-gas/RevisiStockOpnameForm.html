<?!= '<script> window.GLOBAL_USER = ' + userDataJson + '; window.EXISTING_DATA = ' + existingDataJson + '; </script>' ?>

<div class="space-y-6 font-serif text-gray-800 pb-10">
    <!-- Header -->
    <div class="border-b-2 border-red-900 pb-4 mb-8 flex justify-between items-end">
        <div>
            <h1 class="text-3xl font-bold text-red-900 uppercase tracking-wider">Berita Acara</h1>
            <p class="text-gray-500 text-sm font-sans font-bold mt-1">REVISI STOCK OPNAME</p>
            <div id="revisiBadge" class="hidden mt-2 inline-block bg-amber-100 text-amber-800 text-[10px] font-bold px-2 py-0.5 rounded border border-amber-200">MODE REVISI</div>
        </div>
        <div class="text-right">
            <div class="text-xs text-gray-400 font-sans">No. Dokumen</div>
            <div id="docIdDisplay" class="font-mono text-sm font-bold text-gray-600">AUTO-GEN</div>
        </div>
    </div>

    <form id="soForm" class="space-y-6 font-sans text-sm">
        <input type="hidden" id="submissionId" name="submissionId">

        <!-- 1. Data Otomatis (Disamakan dengan BA Lain) -->
        <div class="grid grid-cols-2 gap-4 bg-red-50 p-4 rounded border border-red-100">
            <div>
                <label class="block text-xs font-bold text-gray-400">NAMA</label>
                <input type="text" id="so_nama" class="w-full bg-transparent font-bold text-gray-800 border-b border-gray-300 outline-none" readonly>
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-400">NIK</label>
                <input type="text" id="so_nik" class="w-full bg-transparent font-bold text-gray-800 border-b border-gray-300 outline-none" readonly>
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-400">OUTLET</label>
                <input type="text" id="so_outlet" class="w-full bg-transparent font-bold text-gray-800 border-b border-gray-300 outline-none" readonly>
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-400">POSISI</label>
                <input type="text" id="so_posisi" class="w-full bg-transparent font-bold text-gray-800 border-b border-gray-300 outline-none" readonly>
            </div>
        </div>

        <!-- 2. Detail Stock Opname -->
        <div class="grid grid-cols-2 gap-6">
            <div>
                <label class="block font-bold text-gray-700 mb-1">Tanggal Stock Opname</label>
                <input type="date" name="tanggalSO" id="dateInput" required class="w-full border border-gray-300 rounded p-2 outline-none focus:border-red-800 transition">
            </div>
            <div>
                <label class="block font-bold text-gray-700 mb-1">Periode / Keterangan</label>
                <input type="text" name="periodeSO" id="periodeInput" placeholder="Contoh: Akhir Bulan November" class="w-full border border-gray-300 rounded p-2 outline-none focus:border-red-800 transition">
            </div>
        </div>

        <!-- 3. Tabel Revisi Item -->
        <div class="space-y-2">
            <h3 class="font-bold text-gray-800 border-l-4 border-red-900 pl-2">Detail Revisi Item</h3>
            <div class="border rounded-lg overflow-hidden shadow-sm overflow-x-auto">
                <table class="w-full text-left text-sm min-w-[900px]">
                    <thead class="bg-red-900 text-white">
                        <tr>
                            <th class="py-3 px-3 w-10 text-center">No</th>
                            <th class="py-3 px-3 w-32">Kode Item</th>
                            <th class="py-3 px-3 w-48">Item</th>
                            <th class="py-3 px-3 w-20 text-center">Unit</th>
                            <th class="py-3 px-3 w-24 text-center">QTY Sebelum</th>
                            <th class="py-3 px-3 w-24 text-center">QTY Revisi</th>
                            <th class="py-3 px-3 w-48">Alasan Revisi</th>
                            <th class="py-3 px-3 w-10 text-center">#</th>
                        </tr>
                    </thead>
                    <tbody id="itemContainer" class="divide-y divide-gray-200 bg-white"></tbody>
                </table>
            </div>
            
            <!-- Tombol Tambah Baris -->
            <button type="button" id="btnAddRow" class="mt-2 text-xs font-bold text-white bg-amber-500 hover:bg-amber-600 px-4 py-2 rounded shadow flex items-center transition transform active:scale-95">
                + Tambah Baris
            </button>
        </div>

        <!-- 4. Upload Bukti -->
        <div class="space-y-4 pt-6 border-t mt-6">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-red-900 border-l-4 border-red-900 pl-3">Bukti / Lampiran</h3>
                <button type="button" id="btnAddPhoto" class="text-xs font-bold text-blue-600 hover:underline">+ Tambah Slot Foto</button>
            </div>
            
            <div id="photoContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="space-y-2 border p-2 rounded bg-gray-50 relative">
                    <label class="block text-xs font-bold text-gray-500 uppercase">Foto Lembar SO Fisik</label>
                    <input type="file" accept="image/*" class="file-input w-full text-xs p-2 border rounded" data-key="fotoLembarSO" onchange="previewImageLocal(this)">
                    <div class="preview-box hidden mt-2 w-full h-40 bg-gray-200 rounded flex items-center justify-center overflow-hidden"></div>
                </div>
                <div class="space-y-2 border p-2 rounded bg-gray-50 relative">
                    <label class="block text-xs font-bold text-gray-500 uppercase">Foto Barang / Pendukung</label>
                    <input type="file" accept="image/*" class="file-input w-full text-xs p-2 border rounded" data-key="fotoBarang" onchange="previewImageLocal(this)">
                    <div class="preview-box hidden mt-2 w-full h-40 bg-gray-200 rounded flex items-center justify-center overflow-hidden"></div>
                </div>
            </div>
        </div>

        <div class="mt-8">
            <button type="submit" id="btnSubmit" class="w-full bg-gradient-to-r from-red-900 to-red-800 hover:from-red-800 hover:to-red-700 text-white font-bold py-4 rounded-lg shadow-lg transition transform active:scale-[0.99]">SIMPAN & KIRIM</button>
        </div>
    </form>
</div>

<script>
    (function() {
        // --- 1. AUTO POPULATE USER DATA (FIXED) ---
        // Mengambil data dari variabel global yang di-inject oleh Apps Script
        const user = window.GLOBAL_USER;
        const existing = window.EXISTING_DATA;
        
        // Pastikan elemen ada sebelum diisi value-nya
        if (user) {
            const elNama = document.getElementById('so_nama');
            const elNik = document.getElementById('so_nik');
            const elOutlet = document.getElementById('so_outlet');
            const elPosisi = document.getElementById('so_posisi');

            if (elNama) elNama.value = user.NAME || '';
            if (elNik) elNik.value = user.NIK || '';
            if (elOutlet) elOutlet.value = user.OUTLET || '';
            if (elPosisi) elPosisi.value = user.POSITION || '';
        }

        // --- 2. TABLE LOGIC (FIXED) ---
        
        // Fungsi Hapus Baris (Dibuat Global agar bisa dipanggil onclick)
        window.removeRow = function(btn) {
            btn.closest('tr').remove();
            window.reindexRows();
        };

        // Fungsi Tambah Baris (Dibuat Global)
        window.addItemRow = function(data = null) {
            const tbody = document.getElementById('itemContainer');
            // Cek jika tbody null (mencegah error jika DOM belum siap sepenuhnya)
            if(!tbody) return;

            const rowCount = tbody.rows.length + 1;
            const tr = document.createElement('tr');
            
            tr.innerHTML = `
                <td class="py-2 px-3 text-center text-gray-500 align-middle index-cell">${rowCount}</td>
                <td class="py-2 px-2"><input type="text" class="w-full border-b border-gray-300 outline-none py-1 focus:border-red-800 bg-transparent kode-input" placeholder="Kode" value="${data?data.kodeItem:''}" required></td>
                <td class="py-2 px-2"><input type="text" class="w-full border-b border-gray-300 outline-none py-1 focus:border-red-800 bg-transparent item-input" placeholder="Nama Item" value="${data?data.item:''}" required></td>
                <td class="py-2 px-2"><input type="text" class="w-full text-center border-b border-gray-300 outline-none py-1 focus:border-red-800 bg-transparent unit-input" placeholder="Unit" value="${data?data.unit:''}" required></td>
                <td class="py-2 px-2"><input type="number" step="any" class="w-full text-center border-b border-gray-300 outline-none py-1 focus:border-red-800 bg-transparent qty-before-input" placeholder="0" value="${data?data.qtySebelum:''}" required></td>
                <td class="py-2 px-2"><input type="number" step="any" class="w-full text-center border-b border-gray-300 outline-none py-1 focus:border-red-800 bg-transparent qty-revisi-input" placeholder="0" value="${data?data.qtyRevisi:''}" required></td>
                <td class="py-2 px-2"><input type="text" class="w-full border-b border-gray-300 outline-none py-1 focus:border-red-800 bg-transparent alasan-input" placeholder="Ket." value="${data?data.alasan:''}" required></td>
                <td class="py-2 px-3 text-center"><button type="button" onclick="window.removeRow(this)" class="text-red-500 font-bold text-lg hover:bg-red-100 rounded px-2 transition">×</button></td>
            `;
            tbody.appendChild(tr);
        };

        // Fungsi Re-index Nomor Urut
        window.reindexRows = function() {
            const rows = document.querySelectorAll('#itemContainer tr');
            rows.forEach((tr, index) => { 
                tr.querySelector('.index-cell').textContent = index + 1; 
            });
        }

        // Pasang Event Listener ke Tombol Tambah Baris
        const btnAdd = document.getElementById('btnAddRow');
        if(btnAdd) {
            btnAdd.addEventListener('click', function() {
                window.addItemRow();
            });
        }

        // --- 3. PHOTO LOGIC ---
        let extraPhotoCount = 0;
        window.addPhotoSlot = function(existingUrl = null, keyName = null) {
            extraPhotoCount++;
            const container = document.getElementById('photoContainer');
            const div = document.createElement('div');
            const key = keyName || `fotoTambahan${extraPhotoCount}`;
            const label = keyName ? 'Foto Lama' : `Foto Tambahan #${extraPhotoCount}`;
            
            div.className = "space-y-2 border p-2 rounded bg-gray-50 relative";
            div.innerHTML = `
                <div class="flex justify-between">
                    <label class="block text-xs font-bold text-gray-500 uppercase">${label}</label>
                    <button type="button" onclick="this.parentElement.parentElement.remove();" class="text-red-500 text-xs font-bold hover:underline">Hapus</button>
                </div>
                <input type="file" accept="image/*" class="file-input w-full text-xs p-2 border rounded" data-key="${key}" onchange="previewImageLocal(this)">
                <div class="preview-box hidden mt-2 w-full h-40 bg-gray-200 rounded flex items-center justify-center overflow-hidden"></div>
            `;
            container.appendChild(div);

            if(existingUrl) {
                const pBox = div.querySelector('.preview-box');
                pBox.innerHTML = `<img src="${existingUrl}" class="w-full h-full object-cover">`;
                pBox.classList.remove('hidden');
                div.querySelector('input').dataset.oldVal = existingUrl;
            }
        };

        window.previewImageLocal = function(input) {
            const pBox = input.parentElement.querySelector('.preview-box');
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    pBox.innerHTML = `<img src="${e.target.result}" class="w-full h-full object-cover">`;
                    pBox.classList.remove('hidden');
                }
                reader.readAsDataURL(input.files[0]);
            }
        };

        const btnPhoto = document.getElementById('btnAddPhoto');
        if(btnPhoto) {
            btnPhoto.addEventListener('click', () => window.addPhotoSlot());
        }

        // --- 4. DATA LOADING (MODE REVISI) ---
        if (existing) {
            document.getElementById('revisiBadge').classList.remove('hidden');
            document.getElementById('docIdDisplay').textContent = existing.Submission_ID;
            document.getElementById('submissionId').value = existing.Submission_ID;
            
            const btn = document.getElementById('btnSubmit');
            btn.innerHTML = "SIMPAN PERBAIKAN";
            btn.classList.replace('from-red-900', 'from-amber-600');
            btn.classList.replace('to-red-800', 'to-amber-500');

            let json = {};
            try { json = JSON.parse(existing.Data_JSON); } catch(e){}
            
            if(json.tanggalSO) document.getElementById('dateInput').value = json.tanggalSO;
            if(json.periodeSO) document.getElementById('periodeInput').value = json.periodeSO;
            
            if (json.items && Array.isArray(json.items)) {
                json.items.forEach(i => window.addItemRow(i));
            } else { window.addItemRow(); }

            ['fotoLembarSO', 'fotoBarang'].forEach(key => {
                const input = document.querySelector(`input[data-key="${key}"]`);
                if(json[key] && input) {
                    input.dataset.oldVal = json[key];
                    const pBox = input.parentElement.querySelector('.preview-box');
                    pBox.innerHTML = `<img src="${json[key]}" class="w-full h-full object-cover">`;
                    pBox.classList.remove('hidden');
                }
            });

            for(let k in json) {
                if(k.startsWith('fotoTambahan')) window.addPhotoSlot(json[k], k);
            }
        } else {
            // Default: Tambah 1 baris kosong saat load pertama kali
            window.addItemRow(); 
        }

        // --- 5. SUBMIT HANDLER ---
        const form = document.getElementById('soForm');
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            const originalText = btn.innerHTML;
            btn.disabled = true; btn.innerHTML = 'Memproses...';

            const items = [];
            document.querySelectorAll('#itemContainer tr').forEach(tr => {
                items.push({
                    kodeItem: tr.querySelector('.kode-input').value,
                    item: tr.querySelector('.item-input').value,
                    unit: tr.querySelector('.unit-input').value,
                    qtySebelum: tr.querySelector('.qty-before-input').value,
                    qtyRevisi: tr.querySelector('.qty-revisi-input').value,
                    alasan: tr.querySelector('.alasan-input').value
                });
            });

            const formData = {
                tanggalSO: document.getElementById('dateInput').value,
                periodeSO: document.getElementById('periodeInput').value,
                items: items
            };

            const fileInputs = document.querySelectorAll('.file-input');
            const filePromises = Array.from(fileInputs).map(input => {
                return new Promise((resolve) => {
                    const key = input.dataset.key;
                    if (input.files.length > 0) {
                        const reader = new FileReader();
                        reader.onload = (e) => resolve({ key: key, data: e.target.result });
                        reader.readAsDataURL(input.files[0]);
                    } else if (input.dataset.oldVal) {
                        resolve({ key: key, data: input.dataset.oldVal });
                    } else {
                        resolve({ key: key, data: null });
                    }
                });
            });

            const files = await Promise.all(filePromises);
            files.forEach(f => { if(f.data) formData[f.key] = f.data; });

            const submissionId = document.getElementById('submissionId').value;
            const isUpdate = !!submissionId;

            google.script.run.withSuccessHandler(res => {
                if(res.success) { 
                    alert("Sukses! " + res.message); 
                    if(typeof closeForm === 'function') closeForm(); 
                }
                else { 
                    alert("Gagal: " + res.message); 
                    btn.disabled = false; 
                    btn.innerHTML = originalText; 
                }
            }).rekamData(formData, 'Revisi Stock Opname', window.GLOBAL_USER, isUpdate, submissionId);
        });

    })();
</script>
