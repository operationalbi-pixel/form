        function setDailyQuote() {
            try {
                // 1. Dapatkan tanggal hari ini (reset jam ke 00:00 untuk konsistensi)
                const now = new Date();
                const start = new Date(now.getFullYear(), 0, 0);
                
                // 2. Hitung Diff dengan memperhitungkan Timezone Offset agar akurat
                const diff = (now - start) + ((start.getTimezoneOffset() - now.getTimezoneOffset()) * 60 * 1000);
                const oneDay = 1000 * 60 * 60 * 24;
                const dayOfYear = Math.floor(diff / oneDay);
                
                // 3. Tentukan Quote
                let quoteIndex = dayOfYear % quotesData.length;
                
                // Fallback jika index NaN atau error
                if (isNaN(quoteIndex) || quoteIndex < 0) quoteIndex = 0;
                
                const selectedQuote = quotesData[quoteIndex];
                
                // 4. Update UI
                const quoteTextElem = document.getElementById('quoteText');
                const quoteAuthorElem = document.getElementById('quoteAuthor');
                
                // (BAGIAN TANGGAL DIHAPUS SESUAI PERMINTAAN)

                if (quoteTextElem && selectedQuote) {
                    quoteTextElem.textContent = `"${selectedQuote.text}"`;
                    quoteAuthorElem.textContent = selectedQuote.author;
                }
                
            } catch (error) {
                console.error("Gagal memuat quote:", error);
                // Fallback darurat jika semua gagal
                document.getElementById('quoteText').textContent = `"${quotesData[0].text}"`;
                document.getElementById('quoteAuthor').textContent = quotesData[0].author;
            }
        }

        // --- SETUP SAAT HALAMAN SELESAI DIMUAT ---
        document.addEventListener('DOMContentLoaded', function() {

        function openBiSpaceDashboard(user, requestedMode) {
            window.userData = user;
            let page = 'OutletDashboard';
            const approver = user.POSITION === 'AREA MANAGER' || user.POSITION === 'FNB';
            if (approver && requestedMode !== 'user') page = 'ApprovalDashboard';
            google.script.run
                .withSuccessHandler(html => {
                    const container = document.getElementById('appContainer');
                    container.className = 'w-full min-h-screen bg-gray-50';
                    container.innerHTML = html;
                    Array.from(container.querySelectorAll('script')).forEach(oldScript => {
                        const newScript = document.createElement('script');
                        Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                        newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                        oldScript.parentNode.replaceChild(newScript, oldScript);
                    });
                    if (window.initializeDashboard) window.initializeDashboard(user);
                    if (window.refreshBeritaAcaraResponsiveLayout) window.refreshBeritaAcaraResponsiveLayout(container);
                })
                .withFailureHandler(error => {
                    document.getElementById('appContainer').innerHTML = '<div class="m-auto max-w-lg rounded-2xl border border-red-100 bg-white p-8 text-center text-red-800"><h2 class="text-xl font-bold">Berita Acara belum dapat dibuka</h2><p class="mt-3 text-sm">' + String(error && error.message || error) + '</p></div>';
                })
                .include(page);
        }

        function switchBaMode(mode) {
            const user = window.userData || initialBiSpaceUser;
            const approver = user.POSITION === 'AREA MANAGER' || user.POSITION === 'FNB';
            if (!approver) return;
            const nextMode = mode === 'approval' ? 'approval' : 'user';
            window.top.postMessage({ biSpaceBeritaAcara: true, mode: nextMode }, '*');
