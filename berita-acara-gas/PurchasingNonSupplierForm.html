<script>
    // --- HELPER: Image Preview Logic ---
    window.previewImage = function(input, imgId) {
        const file = input.files[0];
        const img = document.getElementById(imgId);
        const box = input.closest('.upload-box');
        const clearBtn = box.querySelector('button');

        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                img.src = e.target.result;
                img.style.display = 'block';
                if(clearBtn) clearBtn.classList.remove('hidden');
            }
            reader.readAsDataURL(file);
        }
    };

    window.clearImage = function(inputId, imgId) {
        const input = document.getElementById(inputId);
        const img = document.getElementById(imgId);
        const box = input.closest('.upload-box');
        const clearBtn = box.querySelector('button');

        input.value = ''; 
        img.src = '';
        img.style.display = 'none';
        if(clearBtn) clearBtn.classList.add('hidden');
    };

    // --- HELPER: Rupiah Formatter & Parser ---
    function formatRupiah(angka, prefix) {
        var number_string = angka.replace(/[^,\d]/g, '').toString(),
            split = number_string.split(','),
            sisa = split[0].length % 3,
            rupiah = split[0].substr(0, sisa),
            ribuan = split[0].substr(sisa).match(/\d{3}/gi);

        if (ribuan) {
            separator = sisa ? '.' : '';
            rupiah += separator + ribuan.join('.');
        }

        rupiah = split[1] != undefined ? rupiah + ',' + split[1] : rupiah;
        return prefix == undefined ? rupiah : (rupiah ? 'Rp ' + rupiah : '');
    }

    function parseRupiah(str) {
        if(!str) return 0;
        return parseInt(str.replace(/[^0-9]/g, '')) || 0;
    }

    // --- HELPER: Table Calculation ---
    function calculateTable() {
        const rows = document.querySelectorAll('#itemsTableBody tr');
        let grandTotal = 0;

        rows.forEach(row => {
            const qty = parseFloat(row.querySelector('[name="p_qty"]').value) || 0;
            const priceInput = row.querySelector('[name="p_price"]');
            const totalInput = row.querySelector('[name="p_total"]');
            
            const price = parseRupiah(priceInput.value);
            const total = qty * price;

            // Update Total Row View
            totalInput.value = formatRupiah(String(total), 'Rp');
            
            grandTotal += total;
        });

        // Update Grand Total
        document.getElementById('grandTotalDisplay').textContent = formatRupiah(String(grandTotal), 'Rp');
    }

    (function() {
        const user = window.GLOBAL_USER;
        const existing = window.EXISTING_DATA;
        
        // 1. Init Data User
        document.getElementById('k_nama').value = user.NAME;
        document.getElementById('k_nik').value = user.NIK;
        document.getElementById('k_position').value = user.POSITION; // Added Position
        document.getElementById('k_outlet').value = user.OUTLET;
        document.getElementById('k_dateDisplay').value = new Date().toLocaleDateString('id-ID');

        // 2. Add Item Logic
        const tbody = document.getElementById('itemsTableBody');
        
        function addItemRow(item = '', qty = '', unit = '', price = 0) {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td class="p-2"><input type="text" name="p_item" class="w-full text-xs border rounded p-1" value="${item}" placeholder="Nama Barang" required></td>
                <td class="p-2"><input type="number" name="p_qty" class="w-full text-xs border rounded p-1 text-center" value="${qty}" placeholder="1" min="1" required oninput="calculateTable()"></td>
                <td class="p-2"><input type="text" name="p_unit" class="w-full text-xs border rounded p-1 text-center" value="${unit}" placeholder="Pcs/Kg"></td>
                <td class="p-2"><input type="text" name="p_price" class="w-full text-xs border rounded p-1 text-right" value="${formatRupiah(String(price), 'Rp')}" placeholder="Rp 0" required onkeyup="this.value=formatRupiah(this.value, 'Rp'); calculateTable()"></td>
                <td class="p-2"><input type="text" name="p_total" class="w-full text-xs border-0 bg-transparent text-right font-bold text-gray-700" value="Rp 0" readonly></td>
                <td class="p-2 text-center"><button type="button" class="text-red-500 hover:text-red-700" onclick="this.closest('tr').remove(); calculateTable()"><i class="fas fa-trash"></i></button></td>
            `;
            tbody.appendChild(row);
            calculateTable();
        }

        document.getElementById('btnAddItem').addEventListener('click', () => addItemRow());

        // 3. Dynamic Extra Photos
        let photoCount = 0;
        document.getElementById('btnAddPhoto').addEventListener('click', function() {
            photoCount++;
            const container = document.getElementById('extraPhotosContainer');
            const div = document.createElement('div');
            div.className = 'upload-box relative';
            div.innerHTML = `
                <input type="file" id="extra_${photoCount}" class="hidden file-input" accept="image/*" data-key="extraPhoto_${photoCount}" onchange="previewImage(this, 'prev_extra_${photoCount}')">
                <label for="extra_${photoCount}" class="cursor-pointer flex items-center justify-center space-x-2">
                    <i class="fas fa-camera text-gray-400"></i>
                    <span class="text-xs font-bold text-gray-600">Foto Barang ${photoCount}</span>
                </label>
                <img id="prev_extra_${photoCount}" class="preview-img" src="">
                <button type="button" class="absolute top-2 right-2 text-red-500 hover:text-red-700" onclick="this.closest('.upload-box').remove()"><i class="fas fa-trash"></i></button>
            `;
            container.appendChild(div);
        });

        // 4. Mode Revisi Populate
        if (existing) {
            document.getElementById('submissionId').value = existing.Submission_ID;
            document.getElementById('docIdDisplay').textContent = existing.Submission_ID;
            document.getElementById('revisiBadge').classList.remove('hidden');

            let data = {};
            try { data = JSON.parse(existing.Data_JSON); } catch(e) {}
            
            const f = document.getElementById('purchasingForm');
            f.querySelector('[name="vendor"]').value = data.vendor || '';
            f.querySelector('[name="tanggalBill"]').value = data.tanggalBill || '';
            f.querySelector('[name="alasan"]').value = data.alasan || '';

            // Populate Items
            if (data.items && Array.isArray(data.items)) {
                data.items.forEach(item => {
                    // Bersihkan harga dari format Rupiah lama jika ada, ambil angka saja
                    let rawPrice = item.price;
                    if(typeof rawPrice === 'string') rawPrice = parseRupiah(rawPrice);
                    addItemRow(item.item, item.qty, item.unit, rawPrice);
                });
            } else {
                addItemRow(); // Default 1 row if empty
            }

            // Populate Photos
            // Logic mapping mirip dengan Entertain Form: Foto pertama dianggap struk
            let photos = data.photos || [];
            if (photos.length > 0) {
                const img = document.getElementById('preview_struk');
                img.src = photos[0];
                img.style.display = 'block';
                document.getElementById('file_struk').setAttribute('data-old-val', photos[0]);
                
                // Sisanya masuk extra
                for(let i=1; i<photos.length; i++) {
                     document.getElementById('btnAddPhoto').click();
                     const imgExtra = document.getElementById(`prev_extra_${photoCount}`);
                     imgExtra.src = photos[i];
                     imgExtra.style.display = 'block';
                     document.getElementById(`extra_${photoCount}`).setAttribute('data-old-val', photos[i]);
                }
            }
        } else {
            // Default 1 Row for New Entry
            addItemRow();
        }

        // ==========================================
        // SCRIPT LOGIKA SUBMIT (ANTI-STUCK)
        // ==========================================
        const btn = document.getElementById('submitBtn');
        const form = document.getElementById('purchasingForm');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin mr-2"></i>Memproses...';
            btn.disabled = true;

            // 1. Ambil Item dari Tabel
            const itemRows = document.querySelectorAll('#itemsTableBody tr');
            if (itemRows.length === 0) {
                alert("Harap isi minimal 1 item pembelian.");
                btn.disabled = false; btn.innerHTML = originalText; return;
            }

            let items = [];
            itemRows.forEach(row => {
                // Simpan harga dalam format number murni agar mudah diolah di spreadsheet
                const rawPrice = parseRupiah(row.querySelector('[name="p_price"]').value);
                const qty = parseFloat(row.querySelector('[name="p_qty"]').value) || 0;
                
                items.push({
                    item: row.querySelector('[name="p_item"]').value,
                    qty: qty,
                    unit: row.querySelector('[name="p_unit"]').value,
                    price: rawPrice, 
                    total: qty * rawPrice,
                    // Vendor sudah ada di header, tapi jika butuh per-item (opsional)
                    vendor: document.querySelector('[name="vendor"]').value 
                });
            });

            // 2. Proses Foto
            const fileInputs = document.querySelectorAll('.file-input');
            const filePromises = Array.from(fileInputs).map(input => {
                return new Promise((resolve) => {
                    const key = input.dataset.key;
                    if (input.files.length > 0) {
                        const reader = new FileReader();
                        reader.onload = (e) => resolve({ key: key, data: e.target.result });
                        reader.readAsDataURL(input.files[0]);
                    } else if (input.dataset.oldVal) {
                        resolve({ key: key, data: input.dataset.oldVal });
                    } else {
                        resolve({ key: key, data: null });
                    }
                });
            });

            const filesData = await Promise.all(filePromises);

            // Ambil foto struk & extra
            const fotoStruk = filesData.find(f => f.key === 'fotoStruk')?.data;
            const extraPhotos = filesData.filter(f => f.key.startsWith('extraPhoto_') && f.data).map(f => f.data);

            let finalPhotos = [];
            if(fotoStruk) finalPhotos.push(fotoStruk);
            if(extraPhotos.length > 0) finalPhotos = finalPhotos.concat(extraPhotos);

            if (finalPhotos.length === 0) {
                alert("Harap upload minimal 1 foto struk/nota.");
                btn.disabled = false; btn.innerHTML = originalText; return;
            }

            // 3. Susun Data
            const formData = {
                vendor: this.querySelector('[name="vendor"]').value,
                tanggalBill: this.querySelector('[name="tanggalBill"]').value,
                alasan: this.querySelector('[name="alasan"]').value,
                items: items,
                // Kirim Grand Total sebagai string Rupiah atau number (disini string agar user lihat sama)
                grandTotal: document.getElementById('grandTotalDisplay').textContent, 
                photos: finalPhotos
            };

            const submissionId = document.getElementById('submissionId').value;
            const isUpdate = !!submissionId;

            // 4. Kirim
            google.script.run
            .withSuccessHandler(res => {
                if (res.success) {
                    alert(`Berita Acara Purchasing berhasil! ID: ${res.baId}`);
                    if (typeof closeForm === 'function') {
                        closeForm();
                    } else {
                        window.location.reload(); 
                    }
                } else {
                    alert('Gagal: ' + res.message);
                    btn.disabled = false; btn.innerHTML = originalText;
                }
            })
            .withFailureHandler(err => {
                alert('Error: ' + err.message);
                btn.disabled = false; btn.innerHTML = originalText;
            })
            .rekamData(formData, 'Purchasing Non Supplier', window.GLOBAL_USER, isUpdate, submissionId);
        });
    })();
</script>
