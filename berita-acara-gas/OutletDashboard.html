<script>
    let globalData = [];
    let originalData = []; 
    let currentDetailData = null;
    let currentTab = 'all';
    let openCategory = null; 
    
    // PAGINATION STATE
    let currentPage = 1;
    const itemsPerPage = 10;

    // --- SYSTEM INITIALIZATION ---
    function initializeDashboard(user) {
        window.userData = user;
        document.getElementById('outletNameDisplay').textContent = user.OUTLET;
        document.getElementById('userNameDisplay').textContent = user.NAME;
        const switchButton = document.getElementById('switchApprovalMode');
        if (switchButton && (user.POSITION === 'AREA MANAGER' || user.POSITION === 'FNB')) {
            switchButton.classList.remove('hidden');
            switchButton.classList.add('inline-flex');
        }
        setupCategoryToggles(); 
        reloadTable();
        overrideNativeAlert(); 
    }

    // --- MODERN ALERT SYSTEM ---
    function overrideNativeAlert() {
        window.alert = function(message) {
            showCustomModal(message);
        };
    }

    function showCustomModal(message) {
        const modal = document.getElementById('globalModal');
        const iconContainer = document.getElementById('modalIconContainer');
        const icon = document.getElementById('modalIcon');
        const title = document.getElementById('modalTitle');
        const msgEl = document.getElementById('modalMessage');

        // Deteksi Tipe Pesan
        const isSuccess = /sukses|berhasil|success/i.test(message);
        const isError = /gagal|error|validasi/i.test(message);

        if (isSuccess) {
            iconContainer.className = "mx-auto flex items-center justify-center h-16 w-16 rounded-full mb-6 bg-green-100";
            icon.className = "fas fa-check text-3xl text-green-600";
            title.textContent = "Berhasil!";
            title.className = "text-lg font-bold text-green-800 mb-2";
        } else if (isError) {
            iconContainer.className = "mx-auto flex items-center justify-center h-16 w-16 rounded-full mb-6 bg-red-100";
            icon.className = "fas fa-times text-3xl text-red-600";
            title.textContent = "Gagal / Perhatian";
            title.className = "text-lg font-bold text-red-800 mb-2";

    }

    function closeGlobalModal() {
        document.getElementById('globalModal').classList.add('hidden');

    // --- UI LOGIC ---
    function cleanOutletName(name) {
        if (!name) return '';
        return String(name).trim().toUpperCase().replace(/\s+/g, ' ');
    }
    
    function toggleCategory(category) {
        const submenu = document.getElementById('category' + category);
        const toggleBtn = document.getElementById('toggle' + category);
        const categories = ['Operasional', 'Finance', 'Inventory', 'Marketing', 'Purchasing'];

        if (submenu.classList.contains('hidden')) {
            categories.forEach(cat => {
                const sub = document.getElementById('category' + cat);
                const btn = document.getElementById('toggle' + cat);
                if (cat !== category) {
                    sub.classList.add('hidden');
                    btn.classList.remove('expanded');
                }
            });
            submenu.classList.remove('hidden');
            toggleBtn.classList.add('expanded');
            openCategory = category;
        } else {
            submenu.classList.add('hidden');
            toggleBtn.classList.remove('expanded');
            openCategory = null;
        }
    }

    function setupCategoryToggles() {
        const categories = ['Operasional', 'Finance', 'Inventory', 'Marketing', 'Purchasing'];
        categories.forEach(cat => {
            const sub = document.getElementById('category' + cat);
            const btn = document.getElementById('toggle' + cat);
            if (cat === openCategory) { sub.classList.remove('hidden'); btn.classList.add('expanded'); } 
            else { sub.classList.add('hidden'); btn.classList.remove('expanded'); }
        });
    }

    function setTab(tabName) {
        currentTab = tabName;
        ['all', 'wait', 'approved'].forEach(t => {
            const btn = document.getElementById('tab-' + t);
            btn.className = (t === tabName) ? "chrome-tab chrome-tab-active whitespace-nowrap" : "chrome-tab chrome-tab-inactive whitespace-nowrap";

        filterTable();

            skeletonHTML += `<tr class="animate-pulse border-b border-gray-100 last:border-0"><td class="px-6 py-4"><div class="h-4 bg-gray-200 rounded w-24"></div></td><td class="px-6 py-4"><div class="h-4 bg-gray-200 rounded w-16"></div></td><td class="px-6 py-4"><div class="h-4 bg-gray-200 rounded w-32"></div></td><td class="px-6 py-4"><div class="h-4 bg-gray-200 rounded w-20"></div></td><td class="px-6 py-4"><div class="h-5 bg-gray-200 rounded w-24 rounded-full"></div></td><td class="px-6 py-4 text-right"><div class="h-6 bg-gray-200 rounded w-16 ml-auto"></div></td></tr>`;

    function reloadTable() {
        currentPage = 1; // Reset to page 1 on reload
        renderSkeletonLoader();
        const loadTimer = window.setTimeout(function() {
            const body = document.getElementById('submissionTableBody');
            if (body && body.querySelector('.animate-pulse')) {
                body.innerHTML = '<tr><td colspan="7" class="px-5 py-10 text-center"><div class="rounded-xl border border-amber-200 bg-amber-50 p-5 text-amber-800"><strong>Data membutuhkan waktu lebih lama.</strong><br><button type="button" onclick="reloadTable()" class="mt-4 rounded-lg bg-amber-700 px-4 py-2 text-xs font-bold text-white">Muat Ulang</button></div></td></tr>';
            }
        }, 20000);
        google.script.run
            .withSuccessHandler(function(data) {
                window.clearTimeout(loadTimer);
                processInitialData(data);
            })
            .withFailureHandler(function(error) {
                window.clearTimeout(loadTimer);
                const message = String(error && error.message || error || 'Kesalahan tidak diketahui');
                document.getElementById('submissionTableBody').innerHTML = '<tr><td colspan="7" class="px-5 py-10 text-center"><div class="rounded-xl border border-red-200 bg-red-50 p-5 text-red-800"><strong>Gagal memuat riwayat dokumen.</strong><br><span class="mt-2 inline-block text-xs">' + message.replace(/[&<>"']/g, function(char){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[char]; }) + '</span><br><button type="button" onclick="reloadTable()" class="mt-4 rounded-lg bg-red-800 px-4 py-2 text-xs font-bold text-white">Coba Lagi</button></div></td></tr>';
            })
            .getAllSubmissions(window.userData);
    }

    function processInitialData(data) {
        originalData = data || [];
        populateOutletFilter(window.userData.OUTLET);
        filterTable();
    }

    function populateOutletFilter(userOutletName) {
        const filterEl = document.getElementById('outletFilter');
        filterEl.innerHTML = '';
        const option = document.createElement('option');
        option.value = cleanOutletName(userOutletName);
        option.textContent = userOutletName; 
        option.selected = true;
        filterEl.appendChild(option);
    }

    function resetFilters() {
        document.getElementById('startDateFilter').value = '';
        document.getElementById('endDateFilter').value = '';
        document.getElementById('typeFilter').value = '';
        document.getElementById('infoFilter').value = ''; // NEW
        setTab('all');
    }

    // --- PAGINATION LOGIC ---
    function updatePagination() {
        const totalItems = globalData.length;
        const totalPages = Math.ceil(totalItems / itemsPerPage);
        
        // Ensure currentPage valid
        if (currentPage < 1) currentPage = 1;
        if (currentPage > totalPages && totalPages > 0) currentPage = totalPages;
        
        // Slice Data
        const startIdx = (currentPage - 1) * itemsPerPage;
        const endIdx = startIdx + itemsPerPage;
        const pagedData = globalData.slice(startIdx, endIdx);
        
        // Render current slice
        renderTable(pagedData);

        // Update Info Text
        const startDisplay = totalItems === 0 ? 0 : startIdx + 1;
        const endDisplay = Math.min(endIdx, totalItems);
        document.getElementById('paginationInfo').textContent = `Menampilkan ${startDisplay}-${endDisplay} dari ${totalItems} data`;
        
        // Update Buttons
        document.getElementById('btnPrev').disabled = currentPage === 1;
        document.getElementById('btnNext').disabled = currentPage >= totalPages || totalPages === 0;
    }

    function changePage(delta) {
        currentPage += delta;
        updatePagination();
    }

    function filterTable() {
        const outletFilterVal = document.getElementById('outletFilter').value;
        const typeFilterVal = document.getElementById('typeFilter').value;
        const startDateVal = document.getElementById('startDateFilter').value;
        const endDateVal = document.getElementById('endDateFilter').value;
        const infoFilterVal = document.getElementById('infoFilter').value.toLowerCase(); // NEW
        
        let filteredData = originalData.filter(item => {
            const matchOutlet = cleanOutletName(item.Outlet) === outletFilterVal;
            
            let matchType = true;
            if (typeFilterVal) {
                 matchType = item.type === typeFilterVal;
            }

            let matchDate = true;
            if (startDateVal || endDateVal) {
                const itemDate = new Date(item.Timestamp);
                itemDate.setHours(0,0,0,0);
                if (startDateVal) {
                    const start = new Date(startDateVal);
                    start.setHours(0,0,0,0);
                    if (itemDate < start) matchDate = false;
                }
                if (endDateVal && matchDate) { 
                    const end = new Date(endDateVal);
                    end.setHours(0,0,0,0);
                    if (itemDate > end) matchDate = false;
                }
            }

            let matchTab = true;
            const statusLower = (item.currentStatus || '').toLowerCase();
            if (currentTab === 'wait') {
                matchTab = statusLower.includes('menunggu') || statusLower.includes('waiting') || statusLower.includes('pending');
            } else if (currentTab === 'approved') {
                matchTab = statusLower === 'approved';
            }

            // NEW: MATCH INFO
            let matchInfo = true;
            if (infoFilterVal) {
                const itemInfo = (item.info || '').toLowerCase();
                matchInfo = itemInfo.includes(infoFilterVal);
            }

            return matchOutlet && matchType && matchDate && matchTab && matchInfo;
        });
        
        globalData = filteredData;
        currentPage = 1; // Reset to page 1 whenever filters change
        updatePagination(); // Use pagination render
    }

            return;
        }
        
        tbody.innerHTML = data.map((row) => {
            // Display Type Logic
            let displayType = row.type;
            if(row.type === 'Waste Pcs To Pcs') displayType = 'Waste';
            if(row.type === 'Revisi Stock Opname') displayType = 'Revisi SO';
            if(row.type === 'Konsumsi General Cleaning') displayType = 'Konsumsi GC';
            if(row.type === 'Penjualan & Dispose Asset') displayType = 'Jual Asset';
            if(row.type === 'Refund Customer') displayType = 'Refund Cust';
            if(row.type === 'Komplain Customer') displayType = 'Komplain';
            if(row.type === 'Minute of Meeting') displayType = 'MoM';
            if(row.type === 'Purchasing Non Supplier') displayType = 'Purchasing';
            if(row.type === 'Customer Entertain') displayType = 'Entertain';
            if(row.type === 'Test Food') displayType = 'Test Food';
            if(row.type === 'Discount Karyawan') displayType = 'Disc. Karyawan'; 
            if(row.type === 'Cancel Online') displayType = 'Cancel Online'; 

            let rowClass = 'hover:bg-red-50 transition';
            let statusColor = ''; 
            
            if (row.currentStatus === 'Rejected') {
                 rowClass = 'bg-red-50 hover:bg-red-100 text-red-700 font-medium';
                 statusColor = 'bg-red-100 text-red-800 border-red-200';
            } else if (row.currentStatus === 'Approved') {

            } else {
                 statusColor = 'bg-[#FFF7D1] text-[#785906] border border-[#FDE68A]';

            const infoText = row.info && row.info !== '-' ? 
                `<div class="text-xs font-semibold text-gray-600 line-clamp-2" title="${row.info}">${row.info}</div>` : 
                `<span class="text-gray-300 text-xs italic">-</span>`;

            }
            if(item.type === 'Purchasing Non Supplier') {
                 html += `<div class="grid grid-cols-2 gap-4 mb-3"><div><span class="text-xs text-gray-500 block">Vendor</span><span class="font-bold">${safeStr(jsonData.vendor)}</span></div><div><span class="text-xs text-gray-500 block">Tanggal Bill</span><span class="font-bold">${safeStr(jsonData.tanggalBill)}</span></div><div class="col-span-2"><span class="text-xs text-gray-500 block">Keperluan</span><span>${safeStr(jsonData.alasan)}</span></div><div class="col-span-2 border-t pt-2 font-bold text-right text-red-700">Total: ${safeStr(jsonData.grandTotal)}</div></div>`;
            }
            if(item.type === 'Konsumsi General Cleaning') {
                 html += `<div class="mb-3"><span class="text-xs text-gray-500 block">Keperluan</span><span class="font-bold">${safeStr(jsonData.alasan)}</span></div>`;
            }
            if(item.type === 'Waste Pcs To Pcs') {
                 // Hitung Total Value jika ada di items
                 let totalWaste = 0;
                 let itemsCalc = typeof jsonData.items === 'string' ? JSON.parse(jsonData.items) : (jsonData.items||[]);
                 itemsCalc.forEach(i => {
                     let v = i.total || i.subtotal || 0;
                     if(typeof v === 'string') v = parseFloat(v.replace(/[^0-9]/g, '')) || 0;
                     totalWaste += v;
                 });
                 
                 if(totalWaste > 0) {
                     html += `<div class="mb-3 border-b border-gray-100 pb-2"><span class="text-xs text-gray-500 block">Total Value Waste</span><span class="font-bold text-red-700 text-lg">${fmtRupiah(totalWaste)}</span></div>`;
                 }
            }
            
            let items = [];
            try { items = typeof jsonData.items === 'string' ? JSON.parse(jsonData.items) : jsonData.items; } catch(e){}
            
            if(items && items.length > 0) {
                html += `<div class="border-t pt-2"><span class="text-xs text-gray-500 block mb-1">Rincian Item</span>
                    <div class="overflow-x-auto"><table class="w-full text-xs text-left border"><thead class="bg-gray-100 font-bold"><tr>
                        <th class="p-2">Item/Menu</th><th class="p-2 text-center">Qty</th><th class="p-2 text-right">Total/Ket</th>
                    </tr></thead><tbody>`;
                items.forEach(i => {
                    // Logic Name Check Lengkap
                    const name = i.item || i.namaItem || i.menu || i.namaMenu || i.kodeItem || '-';
                    const qty = i.qty || i.qtyRevisi || '-';
                    
                    // Logic Value Check (Enhanced to show BOTH Total AND Reason)
                    let valRaw = i.total || i.price;
                    let reasonRaw = i.reason || i.alasan || i.ket;
                    let displayVal = '';

                    if (valRaw) {
                        displayVal += `<div class="font-bold">${valRaw}</div>`;
                    }
                    
                    if (reasonRaw) {
                         // Jika sudah ada value, reason jadi kecil
                         if(valRaw) displayVal += `<div class="text-[10px] text-gray-500 italic leading-tight mt-0.5">${reasonRaw}</div>`;
                         else displayVal += `<div>${reasonRaw}</div>`;
                    }

                    if (!displayVal) displayVal = '-';
                    
                    html += `<tr><td class="p-2 border-b">${name}</td><td class="p-2 border-b text-center">${qty} ${i.unit||''}</td><td class="p-2 border-b text-right">${displayVal}</td></tr>`;
                });
                html += `</tbody></table></div></div>`;
            }
        }
        // -- TEST FOOD --
        else if (item.type === 'Test Food') {
             html += `
                <div class="grid grid-cols-2 gap-4">
                    <div><span class="text-xs text-gray-500 block">Lokasi</span><span class="font-bold">${safeStr(jsonData.lokasiTest)}</span></div>
                    <div><span class="text-xs text-gray-500 block">Keperluan</span><span class="font-bold">${safeStr(jsonData.keperluanTest)}</span></div>
                    <div class="col-span-2 border-t pt-2"><span class="text-xs text-gray-500 block mb-1">Penilaian Menu</span>
                         <div class="overflow-x-auto"><table class="w-full text-xs text-left"><thead class="bg-gray-50 font-bold"><tr><th class="p-2">Menu</th><th class="p-2 text-center">Rasa</th><th class="p-2 text-center">Tekstur</th><th class="p-2 text-center">Status</th></tr></thead>
                         <tbody>${(typeof jsonData.items === 'string' ? JSON.parse(jsonData.items) : (jsonData.items||[])).map(i => `<tr><td class="p-2 border-b">${i.menu}</td><td class="p-2 border-b text-center">${i.taste}</td><td class="p-2 border-b text-center">${i.texture}</td><td class="p-2 border-b text-center font-bold ${i.status==='Pass'?'text-green-600':'text-red-600'}">${i.status}</td></tr>`).join('')}</tbody></table></div>
                    </div>
                </div>`;
        }
        // -- KOL & ENTERTAIN & DISCOUNT --
        else if (['KOL Foodies', 'Customer Entertain', 'Discount Karyawan'].includes(item.type)) {
             const lblNama = item.type === 'Discount Karyawan' ? 'Nama Karyawan' : (item.type === 'KOL Foodies' ? 'Nama Foodies' : 'Tujuan Entertain');
             const valNama = jsonData.namaKaryawan || jsonData.namaFoodies || jsonData.tujuan;
             
             html += `
                <div class="grid grid-cols-2 gap-4">
                    <div><span class="text-xs text-gray-500 block">${lblNama}</span><span class="font-bold">${safeStr(valNama)}</span></div>
                    <div><span class="text-xs text-gray-500 block">Total Bill</span><span class="font-bold text-red-700">${fmtRupiah(jsonData.totalBill)}</span></div>
                    <div><span class="text-xs text-gray-500 block">No Bill</span><span>${safeStr(jsonData.noBill)}</span></div>
                    ${jsonData.nominalDiskon ? `<div><span class="text-xs text-gray-500 block">Nominal Diskon</span><span class="font-bold text-green-700">${fmtRupiah(jsonData.nominalDiskon)}</span></div>` : ''}
                    
                    ${item.type === 'Discount Karyawan' ? `<div><span class="text-xs text-gray-500 block">ID Karyawan</span><span>${safeStr(jsonData.idKaryawan)}</span></div><div class="col-span-2"><span class="text-xs text-gray-500 block">Keterangan</span><span class="italic">${safeStr(jsonData.keterangan)}</span></div>` : ''}
                    ${item.type === 'Customer Entertain' ? `<div><span class="text-xs text-gray-500 block">Tanggal Bill</span><span>${safeStr(jsonData.tanggalBill)}</span></div>` : ''}
                </div>`;
        }
        // -- MOM --
        else if (item.type === 'Minute of Meeting') {
             html += `
                <div class="grid grid-cols-2 gap-4">
                    <div class="col-span-2"><span class="text-xs text-gray-500 block">Judul Meeting</span><span class="font-bold">${safeStr(jsonData.namaMeeting)}</span></div>
                    <div><span class="text-xs text-gray-500 block">Waktu</span><span>${safeStr(jsonData.tanggalMeeting)} ${safeStr(jsonData.jamMeeting)}</span></div>
                    <div><span class="text-xs text-gray-500 block">Tempat</span><span>${safeStr(jsonData.tempatMeeting)}</span></div>
                    <div class="col-span-2 border-t pt-2"><span class="text-xs text-gray-500 block mb-1">Peserta Hadir (${(jsonData.attendance||[]).length})</span>
                         <div class="flex flex-wrap gap-2">${(jsonData.attendance||[]).map(a => `<span class="px-2 py-1 bg-gray-100 rounded text-xs">${a.nama}</span>`).join('')}</div>
                    </div>
                </div>`;
        }
        
        html += `</div>`;

        // 3. PHOTOS (SMART SCANNING)
        let photos = [];
        
        // Scan semua key di root level JSON yang mengandung kata kunci foto
        Object.keys(jsonData).forEach(key => {
            const lowerKey = key.toLowerCase();
            if ((lowerKey.includes('foto') || lowerKey.includes('photo') || lowerKey.includes('struk') || lowerKey.includes('bukti') || lowerKey.includes('bill')) && typeof jsonData[key] === 'string' && jsonData[key].startsWith('data:image')) {
                 photos.push({src: jsonData[key], label: key.replace(/([A-Z])/g, ' $1').toUpperCase()});
            }
        });

        // Scan Array 'files' (Khusus Cancel Online)
        if(jsonData.files) {
             Object.keys(jsonData.files).forEach(k => {
                 if(Array.isArray(jsonData.files[k])) {
                     jsonData.files[k].forEach((src, i) => {
                         if(src && src.startsWith('data:image')) photos.push({src, label: k.toUpperCase() + ' ' + (i+1)});
                     });
                 }
             });
        }
        
        // Scan Array 'photos', 'extraPhotos', 'kronologis'
        if(Array.isArray(jsonData.photos)) jsonData.photos.forEach((src,i) => { if(src) photos.push({src, label: 'FOTO '+(i+1)}) });
        if(Array.isArray(jsonData.extraPhotos)) jsonData.extraPhotos.forEach((src,i) => { if(src) photos.push({src, label: 'EXTRA '+(i+1)}) });
        if(Array.isArray(jsonData.kronologis)) jsonData.kronologis.forEach((k,i) => { if(k.photo) photos.push({src: k.photo, label: 'KRONOLOGIS '+(i+1)}) });
        
        // Scan items with photos (Test Food, Waste)
        try { 
            let itms = typeof jsonData.items === 'string' ? JSON.parse(jsonData.items) : jsonData.items;
            if(Array.isArray(itms)) itms.forEach((m,i) => { 
                if(m.photo) photos.push({src: m.photo, label: m.menu || 'MENU '+(i+1)});
                if(m.foto) photos.push({src: m.foto, label: m.item || 'ITEM '+(i+1)}); // Utk Waste
            });
        } catch(e){}

        // Hapus duplikat berdasarkan src string
        photos = photos.filter((v,i,a)=>a.findIndex(t=>(t.src === v.src))===i);

        if (photos.length > 0) {
            html += `
                <div class="mt-4">
                    <h5 class="text-xs font-bold text-gray-500 uppercase mb-2">Lampiran Foto (${photos.length})</h5>
                    <div class="flex gap-2 overflow-x-auto pb-2">
                        ${photos.map(p => `
                            <div class="shrink-0 w-24 h-24 bg-gray-200 rounded overflow-hidden relative group border cursor-pointer" onclick="window.open('${p.src}')">
                                <img src="${p.src}" class="w-full h-full object-cover">
                                <div class="absolute inset-0 bg-black bg-opacity-0 group-hover:bg-opacity-10 transition"></div>
                                <div class="absolute bottom-0 left-0 right-0 bg-black bg-opacity-60 text-white text-[9px] p-1 truncate text-center">${p.label}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        html += `</div>`; // Close space-y-6

        container.innerHTML = html;

        // Tombol Aksi
        actionContainer.innerHTML = '';
        
        const isApproved = item.currentStatus === 'Approved';
        const isRejected = item.currentStatus === 'Rejected';

        if (isApproved) {
            const btnPdf = document.createElement('button');
            btnPdf.className = "bg-red-800 hover:bg-red-900 text-white font-bold py-2 px-4 rounded shadow-sm flex items-center transition transform active:scale-95 text-sm";
            btnPdf.innerHTML = '<i class="fas fa-file-pdf mr-2"></i> Download PDF';
            btnPdf.onclick = () => { 
                if(window.generatePDF) { window.generatePDF(item, jsonData); } 
                else { alert("Library PDF belum siap."); }
            };
            actionContainer.appendChild(btnPdf);
        }

        if (isRejected) {
            const btnEdit = document.createElement('button');
            btnEdit.className = "bg-amber-500 hover:bg-amber-600 text-white font-bold py-2 px-4 rounded flex items-center shadow-sm animate-pulse text-sm";
            btnEdit.innerHTML = '<i class="fas fa-edit mr-2"></i> PERBAIKI DATA';
            btnEdit.onclick = () => { 
                document.getElementById('detailModal').classList.add('hidden');
                loadForm(item.type, item); // INI BARU MEMBUKA FORM EDIT
            };
            actionContainer.appendChild(btnEdit);
        }
    }

    function closeDetail() { document.getElementById('detailModal').classList.add('hidden'); }
    
    function loadForm(type, existingData = null) {
        document.getElementById('listView').classList.add('hidden'); 
        document.getElementById('formContainer').classList.remove('hidden'); 
        document.getElementById('formContent').innerHTML = '<div class="text-center py-20 flex flex-col items-center justify-center"><i class="fas fa-circle-notch fa-spin text-4xl text-red-800 mb-4"></i><span class="text-gray-500 font-medium">Memuat Form...</span></div>';
        
        let filename = ''; 
        if (type === 'KOL Foodies') filename = 'KOLFoodiesForm'; 
        if (type === 'Void') filename = 'VoidForm'; 
        if (type === 'Waste Pcs To Pcs') filename = 'WastePcsToPcsForm';
        if (type === 'Revisi Stock Opname') filename = 'RevisiStockOpnameForm';
        if (type === 'Konsumsi General Cleaning') filename = 'KonsumsiGeneralCleaningForm';
        if (type === 'Penjualan & Dispose Asset') filename = 'BeritaAcaraPenjualanDisposeAssetForm';
        if (type === 'Quotation') filename = 'QuotationForm.html'; 
        if (type === 'Invoice') filename = 'InvoiceForm.html'; 
        if (type === 'Refund Customer') filename = 'RefundCustomerForm';
        if (type === 'Komplain Customer') filename = 'ComplainHandlingForm';
        if (type === 'Minute of Meeting') filename = 'MinuteOfMeetingForm';
        if (type === 'Purchasing Non Supplier') filename = 'PurchasingNonSupplierForm.html';
        if (type === 'Customer Entertain') filename = 'CustomerEntertainForm';
        if (type === 'Test Food') filename = 'TestFoodForm.html';
        
        // NEW FORMS TAHAP 2
        if (type === 'Discount Karyawan') filename = 'DiscountKaryawanForm';
        if (type === 'Cancel Online') filename = 'CancelOnlineForm';

        if(filename) {
            google.script.run.withSuccessHandler(html => { 
                const c = document.getElementById('formContent'); 
                c.innerHTML = html; 
                const scripts = c.querySelectorAll('script'); 
                scripts.forEach(oldScript => { 
                    const newScript = document.createElement('script'); 
                    Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value)); 
                    newScript.appendChild(document.createTextNode(oldScript.innerHTML)); 
                    oldScript.parentNode.replaceChild(newScript, oldScript); 
                }); 
            }).includeForm(filename, window.userData, existingData);
        } else {
            console.error('Form belum tersedia untuk tipe: ' + type);
            closeForm();
        }
    }
    function closeForm() { 
        document.getElementById('formContainer').classList.add('hidden'); 
        document.getElementById('listView').classList.remove('hidden'); 
        document.getElementById('formContent').innerHTML = ''; 
        reloadTable(); 
    }
</script>
</body>
</html>
