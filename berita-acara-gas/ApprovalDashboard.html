<script>
    let originalData = [];
    let displayData = [];
    let currentDetailData = null;
    let currentSelectedIndex = -1;
    let currentTab = 'need_action';
    let tempApproveIndex = -1; 
    
    // --- PAGINATION VARIABLES ---
    let currentPage = 1;
    const itemsPerPage = 10;

    // --- FLOW DEFINITIONS (SINKRON DENGAN BACKEND) ---
    const FLOW_FNB_REQUIRED = [
        'Waste Pcs To Pcs', 'Penjualan & Dispose Asset', 
        'Purchasing Non Supplier', 'Test Food', 'Revisi Stock Opname'
    ];
    
    const FLOW_AM_ONLY = [
        'KOL Foodies', 'Void', 'Konsumsi General Cleaning', 'Quotation', 'Invoice',
        'Refund Customer', 'Komplain Customer', 'Minute of Meeting', 'Customer Entertain',
        'Discount Karyawan', 'Cancel Online'
    ];

    function initializeDashboard(user) {
        window.userData = user;
        document.getElementById('roleDisplay').textContent = user.POSITION;
        document.getElementById('approverName').textContent = user.NAME;
        loadData();
    }

    // --- DATA FETCHING (SAFE LOAD) ---
    function loadData() {
        document.getElementById('approvalBody').innerHTML = '<tr><td colspan="8" class="text-center py-20"><div class="flex flex-col items-center justify-center"><i class="fas fa-circle-notch fa-spin text-blue-600 text-3xl mb-4"></i><span class="text-slate-500 font-medium">Sedang memuat data...</span></div></td></tr>';
        const loadTimer = window.setTimeout(function() {
            const body = document.getElementById('approvalBody');
            if (body && /Sedang memuat data/i.test(body.textContent || '')) {
                body.innerHTML = '<tr><td colspan="8" class="px-6 py-12 text-center text-amber-800"><div class="rounded-xl border border-amber-200 bg-amber-50 p-5"><strong>Data membutuhkan waktu lebih lama.</strong><br><span class="mt-2 inline-block text-xs">Periksa koneksi, lalu tekan tombol muat ulang di bawah.</span><br><button type="button" onclick="loadData()" class="mt-4 rounded-lg bg-amber-700 px-4 py-2 text-xs font-bold text-white">Muat Ulang</button></div></td></tr>';
            }
        }, 20000);
        google.script.run
            .withSuccessHandler(function(data) {
                window.clearTimeout(loadTimer);
                processData(data);
            })
            .withFailureHandler(function(error) {
                window.clearTimeout(loadTimer);
                console.error("Load Error:", error);
                document.getElementById('approvalBody').innerHTML = `<tr><td colspan="8" class="text-center py-10 text-red-600 font-bold bg-red-50 rounded-lg border border-red-200 m-4"><i class="fas fa-exclamation-triangle text-2xl mb-2"></i><br>Gagal memuat data.<br><span class="text-sm font-normal text-gray-600">${error.message}</span></td></tr>`;
            })
            .getAllSubmissions(window.userData);
    }

    function processData(data) {
        if (!data) data = [];

        const user = window.userData;
        const position = (user.POSITION || '').toUpperCase().trim();
        
        const relevantData = data.filter(ba => {
            const isAmFlow = [...FLOW_AM_ONLY, ...FLOW_FNB_REQUIRED];
            const isFnbFlow = FLOW_FNB_REQUIRED;

            if (position === 'AREA MANAGER') return isAmFlow.includes(ba.type);
            if (position === 'FNB') return isFnbFlow.includes(ba.type);
            return false;
        });

        originalData = relevantData;
        updateNeedActionBadge(relevantData, position);
        populateOutletFilter(relevantData);
        filterTable();
    }
    
    function updateNeedActionBadge(data, position) {
        const count = data.filter(item => checkCanApprove(item, position)).length;
        const badge = document.getElementById('badgeCount');
        badge.textContent = count;
        if(count > 0) badge.classList.remove('hidden'); else badge.classList.add('hidden');
    }

    function populateOutletFilter(data) {
        const outletSelect = document.getElementById('filterOutlet');
        const currentVal = outletSelect.value;
        const outlets = [...new Set(data.map(item => item.Outlet))].sort();
        outletSelect.innerHTML = '<option value="">Semua Outlet</option>';
        outlets.forEach(outlet => {
            if(outlet) {
                const option = document.createElement('option');
                option.value = outlet;
                option.textContent = outlet;
                outletSelect.appendChild(option);
            }
        });
        outletSelect.value = currentVal; 
    }

    function setTab(tabName) {
        currentTab = tabName;
        if(tabName === 'need_action') {
            document.getElementById('tab-need_action').classList.add('chrome-tab-active');
            document.getElementById('tab-all_doc').classList.remove('chrome-tab-active');
        } else {
            document.getElementById('tab-need_action').classList.remove('chrome-tab-active');
            document.getElementById('tab-all_doc').classList.add('chrome-tab-active');
        }
        filterTable();
    }

    function resetFilters() {
        document.getElementById('filterOutlet').value = "";
        document.getElementById('filterType').value = "";
        document.getElementById('filterInfo').value = ""; // RESET INFO INPUT
        document.getElementById('filterStart').value = "";
        document.getElementById('filterEnd').value = "";
        filterTable();
    }

    function filterTable() {
        const fOutlet = document.getElementById('filterOutlet').value;
        const fType = document.getElementById('filterType').value;
        const fInfo = document.getElementById('filterInfo').value.toLowerCase(); // NEW: FILTER INFO
        const fStart = document.getElementById('filterStart').value;
        const fEnd = document.getElementById('filterEnd').value;
        const position = (window.userData.POSITION || '').toUpperCase().trim();

        let filtered = originalData.filter(item => {
            if (currentTab === 'need_action') {
                if (!checkCanApprove(item, position)) return false;
            }
            if (fOutlet && item.Outlet !== fOutlet) return false;
            if (fType && item.type !== fType) return false;
            
            // NEW LOGIC: FILTER INFO
            if (fInfo) {
                const infoText = (item.info || '').toLowerCase();
                if (!infoText.includes(fInfo)) return false;
            }

            if (fStart || fEnd) {
                const itemDate = new Date(item.Timestamp);
                itemDate.setHours(0,0,0,0);
                if (fStart) { const sDate = new Date(fStart); sDate.setHours(0,0,0,0); if (itemDate < sDate) return false; }
                if (fEnd) { const eDate = new Date(fEnd); eDate.setHours(0,0,0,0); if (itemDate > eDate) return false; }
            }
            return true;
        });

        // RESET HALAMAN KE 1 SAAT FILTER BERUBAH
        currentPage = 1;
        renderTable(filtered);
    }

    function renderTable(data) {
        const tbody = document.getElementById('approvalBody');
        const position = (window.userData.POSITION || '').toUpperCase().trim();

        // 1. Sort Data
        data.sort((a, b) => {
            const aNeedsAction = checkCanApprove(a, position);
            const bNeedsAction = checkCanApprove(b, position);
            if (aNeedsAction && !bNeedsAction) return -1;
            if (!aNeedsAction && bNeedsAction) return 1;
            return new Date(b.Timestamp) - new Date(a.Timestamp);
        });

        // 2. Simpan Full Data untuk Referensi
        displayData = data; 

        // 3. LOGIKA PAGINASI (SLICE DATA)
        const start = (currentPage - 1) * itemsPerPage;
        const end = start + itemsPerPage;
        const pageData = data.slice(start, end);

        updatePaginationUI(data.length, start, end);

        if (pageData.length === 0) {
            let emptyMsg = currentTab === 'need_action' ? "Kerja bagus! Tidak ada dokumen pending." : "Data tidak ditemukan.";
            tbody.innerHTML = `<tr><td colspan="8" class="px-8 py-16 text-center text-slate-400"><div class="flex flex-col items-center"><i class="fas fa-clipboard-check text-5xl mb-4 text-slate-200"></i><span class="font-medium">${emptyMsg}</span></div></td></tr>`;
            return;
        }

        tbody.innerHTML = pageData.map((row, index) => {
            const canApprove = checkCanApprove(row, position);
            
            // Hitung Index Asli dari displayData agar aksi klik valid
            const absoluteIndex = start + index; 
            
            let statusBadge = '';
            if (row.currentStatus === 'Approved') {
                statusBadge = `<span class="inline-flex items-center px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-100 font-bold text-[10px] tracking-wide uppercase"><i class="fa-solid fa-check mr-1"></i> APPROVED</span>`;

    // --- PAGINATION HELPERS ---
    function updatePaginationUI(totalItems, start, end) {
        const info = document.getElementById('pageInfo');
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
        
        if(totalItems === 0) {
            info.textContent = '0 - 0 dari 0';
            btnPrev.disabled = true;
            btnNext.disabled = true;
            return;
        }
        
        const displayEnd = Math.min(end, totalItems);
        info.textContent = `${start + 1} - ${displayEnd} dari ${totalItems}`;
        
        btnPrev.disabled = currentPage === 1;
        btnNext.disabled = end >= totalItems;
    }

    function prevPage() {
        if (currentPage > 1) {
            currentPage--;
            renderTable(displayData); // Pakai displayData yang sudah tersortir
        }
    }

    function nextPage() {
        if ((currentPage * itemsPerPage) < displayData.length) {
            currentPage++;
            renderTable(displayData); // Pakai displayData yang sudah tersortir
        }
    }

    // --- Helper Checks (Approval Logic) ---
    function checkIsApprovedByMe(ba, position) {
        if (position === 'AREA MANAGER') return !!ba.AM_Approved_Date;
        if (position === 'FNB') return !!ba.FNB_Approved_Date;
        return false;
    }
    
    function checkCanReject(ba, position) {
        // PERBAIKAN LOGIKA REJECT BUTTON: 
        // Izinkan Reject jika dokumen belum selesai (belum ada rejected global)
        // Dan user belum melakukan aksi (Approve/Reject)
        if (ba.currentStatus === 'Rejected') return false; 
        
        const isFnbFlow = FLOW_FNB_REQUIRED;
        if (position === 'AREA MANAGER') {
            if (!isFnbFlow.includes(ba.type)) return !ba.AM_Rejected_Date && !ba.AM_Approved_Date;
            if (isFnbFlow.includes(ba.type)) {
                // Untuk FNB Flow: AM hanya bisa reject JIKA FNB sudah approve, DAN AM belum reject/approve
                return !!ba.FNB_Approved_Date && !ba.AM_Rejected_Date && !ba.AM_Approved_Date;
            }
        }
        
        if (position === 'FNB') {
            if (isFnbFlow.includes(ba.type)) return !ba.FNB_Rejected_Date && !ba.FNB_Approved_Date;
        }
        return false;
    }

    function checkCanApprove(ba, position) {
        if (checkIsApprovedByMe(ba, position)) return false;
        if (ba.currentStatus === 'Rejected') return false; 
        
        const isFnbFlow = FLOW_FNB_REQUIRED;
        if (position === 'AREA MANAGER') {
            if (!isFnbFlow.includes(ba.type)) return !ba.AM_Rejected_Date;
            if (isFnbFlow.includes(ba.type)) return !!ba.FNB_Approved_Date && !ba.AM_Rejected_Date;
        }
        
        if (position === 'FNB') {
            if (isFnbFlow.includes(ba.type)) return !ba.FNB_Rejected_Date;
        }
        return false;
    }

    function renderMinutesTable(data) {
        if (!data || !Array.isArray(data)) return '';

    function renderPhotos(data) {
        let html = '';
        const isTestFood = data.items && Array.isArray(data.items) && data.items.every(item => item.photo !== undefined);
        if (isTestFood) {
            data.items.forEach((item, i) => {
                if (item.photo && item.photo.startsWith('data:image')) {
                    html += `<div class="border rounded p-2 bg-gray-50 shadow-sm"><div class="aspect-video bg-gray-200 rounded overflow-hidden flex items-center justify-center mb-2 relative group border border-gray-200"><img src="${item.photo}" class="object-cover w-full h-full"></div><div class="text-[10px] font-bold text-gray-500 text-center uppercase tracking-wide">Foto Menu: ${item.menu || `Menu ${i+1}`}</div></div>`;
                }
            });
            if (html) return html;
        }

        const photoArr = data.extraPhotos || data.photos;
        if (photoArr && Array.isArray(photoArr)) {
             photoArr.forEach((src, i) => {
                 html += `<div class="border rounded p-2 bg-gray-50 shadow-sm"><div class="aspect-video bg-gray-200 rounded overflow-hidden flex items-center justify-center mb-2 relative group border border-gray-200"><img src="${src}" class="object-cover w-full h-full"></div><div class="text-[10px] font-bold text-gray-500 text-center uppercase tracking-wide">Lampiran ${i+1}</div></div>`;
             });
        }
        else {
            for (const key in data) { 
                if ((key.startsWith('foto') || key.includes('Photo') || key === 'buktiBayar') && data[key] && data[key].startsWith('data:image')) { 
                    let label = key.replace(/([A-Z])/g, ' $1').replace(/^./, str => str.toUpperCase());
                    html += `<div class="border rounded p-2 bg-gray-50 shadow-sm"><div class="aspect-video bg-gray-200 rounded overflow-hidden flex items-center justify-center mb-2 relative group border border-gray-200"><img src="${data[key]}" class="object-cover w-full h-full"></div><div class="text-[10px] font-bold text-gray-500 text-center uppercase tracking-wide">${label}</div></div>`;
                } 
            }
        }
        return html || '<div class="text-gray-400 text-xs italic p-4 border rounded border-dashed w-full text-center col-span-2">Tidak ada foto lampiran.</div>';
    }

    async function downloadPDF() {
        if (!currentDetailData) return;
        let jsonData = {}; try { jsonData = JSON.parse(currentDetailData.Data_JSON); } catch(e) {}
        if (window.generatePDF) { await window.generatePDF(currentDetailData, jsonData); } 
        else { showToast('Sistem PDF belum siap.', 'error'); }
    }

    function closeAppDetail() { 
        document.getElementById('appDetailModal').classList.add('hidden');
        currentSelectedIndex = -1;
    }
    
    function showToast(message, type = 'success') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = `toast ${type === 'error' ? 'toast-error' : ''}`;
        toast.innerHTML = `<i class="fas fa-${type === 'error' ? 'exclamation-circle' : 'check-circle'} mr-2"></i> ${message}`;
        container.appendChild(toast);
        
        setTimeout(() => toast.classList.add('show'), 10);
        setTimeout(() => {
            toast.classList.remove('show');
            setTimeout(() => toast.remove(), 300);
        }, 3000);
    }

    function toggleProcessing(isProcessing, action, skipReload = false) {
        const btnApprove = document.getElementById('modalApproveBtn');
        const btnReject = document.getElementById('modalRejectBtn');
        const btnProcess = document.getElementById('modalProcessBtn');
        btnApprove.classList.add('hidden');
        btnReject.classList.add('hidden');
        
        if (isProcessing) {
            btnProcess.classList.remove('hidden');
            btnProcess.textContent = action === 'approve' ? 'Menyetujui...' : 'Menolak...';
        } else {
            btnProcess.classList.add('hidden');
            if(!skipReload) loadData(); 
        }
    }

    // New Modal Functionality
    function doApprove(index) {
        tempApproveIndex = index;
        const item = displayData[index];
        document.getElementById('approveModalDocId').textContent = item.Submission_ID;
        document.getElementById('approveConfirmModal').classList.remove('hidden');
        
        const btn = document.getElementById('btnConfirmApprove');
        btn.onclick = executeApprove;
    }

    function closeApproveModal() {
        document.getElementById('approveConfirmModal').classList.add('hidden');
        tempApproveIndex = -1;
    }

    function executeApprove() {
        if (tempApproveIndex === -1) return;
        const index = tempApproveIndex;
        const item = displayData[index];
        
        closeApproveModal();
        toggleProcessing(true, 'approve');
        closeAppDetail();

        google.script.run.withSuccessHandler(res => {
            if(res.success) {
                updateLocalData(item.Submission_ID, 'Approved');
                toggleProcessing(false, 'approve', true); 
                showToast(`Dokumen ${item.Submission_ID} berhasil disetujui.`);
            } else {
                showToast(res.message, 'error');
                toggleProcessing(false, 'approve'); 
            }
        }).approveBa(item.sheetName, item.rowNumber, window.userData.NAME, window.userData.POSITION, window.userData);
    }
    
    function showRejectModal(index) {
        const modal = document.getElementById('appDetailModal');
        modal.dataset.tempIndex = index;

        let rejectModal = document.getElementById('rejectReasonModal');
        if (!rejectModal) {
            rejectModal = document.createElement('div');
            rejectModal.id = 'rejectReasonModal';
            rejectModal.className = 'fixed inset-0 bg-black bg-opacity-70 z-[70] flex items-center justify-center p-4 hidden';
            rejectModal.innerHTML = `
                <div class="bg-white rounded-xl shadow-2xl w-full max-w-sm overflow-hidden">
                    <div class="bg-blue-800 p-4 flex justify-between items-center">
                        <h3 class="text-white font-bold text-lg">Alasan Penolakan</h3>
                        <button onclick="document.getElementById('rejectReasonModal').classList.add('hidden')" class="text-white hover:text-gray-200 text-2xl leading-none">&times;</button>
                    </div>
                    <div class="p-6">
                        <p class="text-sm text-gray-700 mb-4">Masukkan alasan penolakan:</p>
                        <textarea id="rejectReasonInput" rows="4" class="w-full border border-gray-300 rounded p-2 outline-none focus:border-blue-800 transition" placeholder="Contoh: Bukti foto kurang jelas..."></textarea>
                        <p id="reasonError" class="text-xs text-red-500 mt-1 hidden">Wajib diisi.</p>
                    </div>
                    <div class="p-4 border-t bg-gray-50 flex justify-end">
                        <button id="confirmRejectBtn" class="bg-blue-700 hover:bg-blue-800 text-white font-bold py-2 px-4 rounded shadow">Konfirmasi Tolak</button>
                    </div>
                </div>`;
            document.body.appendChild(rejectModal);

            document.getElementById('confirmRejectBtn').onclick = function() {
                const reasonInput = document.getElementById('rejectReasonInput');
                const reason = reasonInput.value.trim();
                const error = document.getElementById('reasonError');
                if (!reason) { error.classList.remove('hidden'); return; }
                error.classList.add('hidden');
                document.getElementById('rejectReasonModal').classList.add('hidden');
                doReject(parseInt(modal.dataset.tempIndex), reason);
            };
        }
        document.getElementById('rejectReasonInput').value = ''; 
        document.getElementById('reasonError').classList.add('hidden');
        rejectModal.classList.remove('hidden');
    }
    
    function doReject(index, reason) {
        const item = displayData[index];
        toggleProcessing(true, 'reject');
        closeAppDetail(); 
        google.script.run.withSuccessHandler(res => {
            if(res.success) {
                updateLocalData(item.Submission_ID, 'Rejected', reason);
                toggleProcessing(false, 'reject', true);
                showToast(`Dokumen ${item.Submission_ID} ditolak.`, 'error');
            } else {
                showToast(res.message, 'error');
                toggleProcessing(false, 'reject');
            }
        }).rejectBa(item.sheetName, item.rowNumber, window.userData.NAME, window.userData.POSITION, reason, window.userData);
    }

    // FAST UPDATE HELPER
    function updateLocalData(submissionId, newStatus, reason = '') {
        const userPos = window.userData.POSITION.toUpperCase().trim();
        const userName = window.userData.NAME;
        const now = new Date().toISOString();

        // Find and update item in originalData
        const item = originalData.find(x => x.Submission_ID === submissionId);
        if (item) {
            if (newStatus === 'Approved') {
                if (userPos === 'AREA MANAGER') {
                    item.AM_Approved_Date = now;
                    item.AM_Approved_By = userName;
                } else if (userPos === 'FNB') {
                    item.FNB_Approved_Date = now;
                    item.FNB_Approved_By = userName;
                }
                // We update currentStatus visually, though logic relies on Dates
                item.currentStatus = 'Approved'; 
            } else if (newStatus === 'Rejected') {
                if (userPos === 'AREA MANAGER') {
                    item.AM_Rejected_Date = now;
                    item.AM_Rejected_By = userName;
                } else if (userPos === 'FNB') {
                    item.FNB_Rejected_Date = now;
                    item.FNB_Rejected_By = userName;
                }
                item.currentStatus = 'Rejected';
            }
        }
        
        // Re-run filter to refresh view instantly
        // This moves approved items out of 'Need Action' list immediately
        updateNeedActionBadge(originalData, userPos);
        filterTable();
    }

    // --- ACTIONS ---
    function processApproval(id, status, reason = '') {
        const userPos = window.userData.POSITION.toUpperCase().trim();
        const userName = window.userData.NAME;
        const btnContainer = document.getElementById('modalActions');
        btnContainer.innerHTML = '<span class="text-blue-600 font-bold animate-pulse text-xs">Sedang memproses...</span>';

        const run = status === 'Approved' 
            ? google.script.run.withSuccessHandler(done).approveBa(id, 0, userName, userPos, window.userData)
            : google.script.run.withSuccessHandler(done).rejectBa(id, 0, userName, userPos, reason, window.userData);

        function done(res) {
            if(res.success) {
                // Update Local Data (Optimistic)
                const item = originalData.find(x => x.Submission_ID === id);
                if(item) {
                    item.currentStatus = status; 
                    // Update dates logic skipped for brevity, mainly need status update for UI
                }
                
                // CHANGE: Use showToast instead of alert
                showToast(status === 'Approved' ? "Dokumen berhasil disetujui!" : "Dokumen berhasil ditolak.");
                
                if(status === 'Rejected') closeRejectModal();
                closeModal();
                updateNeedActionBadge(originalData, userPos);
                filterTable();
            } else {
                // CHANGE: Use showToast instead of alert
                showToast("Gagal: " + res.message, 'error');
                
                closeModal(); // Force close to reset state
            }
        }
    }

    function openRejectModal() { document.getElementById('rejectModal').classList.remove('hidden'); }
    function closeRejectModal() { document.getElementById('rejectModal').classList.add('hidden'); document.getElementById('rejectReason').value = ''; }
    function confirmReject() {
        const r = document.getElementById('rejectReason').value;
        if(!r) { 
            // CHANGE: Use showToast
            showToast("Wajib isi alasan penolakan!", 'error'); 
            return; 
        }
        processApproval(currentDetailId, 'Rejected', r);
    }
</script>
