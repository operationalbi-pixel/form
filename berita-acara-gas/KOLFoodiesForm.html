<div class="space-y-6 font-serif text-gray-800 pb-10">
    <div class="border-b-2 border-red-900 pb-4 mb-8 flex justify-between items-end">
        <div>
            <h1 class="text-3xl font-bold text-red-900 uppercase tracking-wider">Berita Acara</h1>
            <p class="text-gray-500 text-sm font-sans font-bold mt-1">KOL & FOODIES VISIT</p>
        </div>
        <div class="text-right">
            <div class="text-xs text-gray-400 font-sans">No. Dokumen</div>
            <div class="font-mono text-sm font-bold text-gray-600">AUTO-GEN</div>
        </div>

    <form id="baForm" class="space-y-6 font-sans text-sm">
        <!-- 1. Data Otomatis -->
        <div class="grid grid-cols-2 gap-4 bg-red-50 p-4 rounded border border-red-100">
            <div><label class="block text-xs font-bold text-gray-400">NAMA</label><input type="text" id="f_nama" class="w-full bg-transparent font-bold text-gray-800 border-b border-gray-300 outline-none" readonly></div>
            <div><label class="block text-xs font-bold text-gray-400">NIK</label><input type="text" id="f_nik" class="w-full bg-transparent font-bold text-gray-800 border-b border-gray-300 outline-none" readonly></div>
            <div><label class="block text-xs font-bold text-gray-400">OUTLET</label><input type="text" id="f_outlet" class="w-full bg-transparent font-bold text-gray-800 border-b border-gray-300 outline-none" readonly></div>
            <div><label class="block text-xs font-bold text-gray-400">POSISI</label><input type="text" id="f_posisi" class="w-full bg-transparent font-bold text-gray-800 border-b border-gray-300 outline-none" readonly></div>
        </div>

        <!-- 2. Tanggal & Hari -->
        <div class="grid grid-cols-2 gap-6">
            <div>
                <label class="block font-bold text-gray-700 mb-1">Tanggal</label>
                <input type="date" name="tanggal" id="dateInput" required class="w-full border border-gray-300 rounded p-2 outline-none focus:border-red-800">
            </div>
            <div>
                <label class="block font-bold text-gray-700 mb-1">Hari</label>
                <input type="text" name="hari" id="dayOutput" readonly class="w-full bg-gray-100 border border-gray-300 rounded p-2 outline-none text-gray-600 font-medium">

        <!-- 3. Info Bill -->
        <div class="space-y-4 border-b pb-4">
            <div>
                <label class="block font-bold text-gray-700 mb-1">Nama KOL / Foodies</label>
                <input type="text" name="namaFoodies" required class="w-full border border-gray-300 rounded p-2 outline-none focus:border-red-800" placeholder="Masukkan Nama">
            </div>
            <div class="grid grid-cols-2 gap-6">
                <div>
                    <label class="block font-bold text-gray-700 mb-1">Nomor Bill</label>
                    <input type="text" name="noBill" required class="w-full border border-gray-300 rounded p-2 outline-none focus:border-red-800">
                </div>
                <div>
                    <label class="block font-bold text-gray-700 mb-1">Total Bill</label>
                    <input type="text" name="totalBill" id="totalBillInput" required class="w-full border border-gray-300 rounded p-2 outline-none focus:border-red-800 text-red-900 font-bold" placeholder="Rp 0">
                </div>
            </div>
        </div>

        <!-- 4. Detail Item -->
        <div>
            <label class="block font-bold text-gray-700 mb-2">Detail Item</label>
            <div class="border rounded-lg overflow-hidden shadow-sm">
                <table class="w-full text-left text-sm">
                    <thead class="bg-red-900 text-white">
                        <tr>
                            <th class="py-3 px-3 w-10 text-center">No</th>
                            <th class="py-3 px-3">Item</th>
                            <th class="py-3 px-3 w-20 text-center">QTY</th>
                            <th class="py-3 px-3 w-10 text-center">#</th>
                        </tr>
                    </thead>
                    <tbody id="itemContainer" class="divide-y divide-gray-200 bg-white"></tbody>
                </table>
            </div>
            <button type="button" id="btnAddItem" class="mt-2 text-xs font-bold text-white bg-amber-500 hover:bg-amber-600 px-4 py-2 rounded shadow flex items-center transition transform active:scale-95">
                + Tambah Baris
            </button>
        </div>

        <!-- 5. Upload Bukti dengan Preview -->
        <div class="space-y-4 pt-6 border-t mt-6">
            <h3 class="font-bold text-red-900 border-l-4 border-red-900 pl-3">Bukti Bill & Email</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-2">
                    <label class="block text-xs font-bold text-gray-500 uppercase">1. Foto Email Marketing</label>
                    <input type="file" accept="image/*" class="file-input w-full text-xs p-2 border rounded" data-key="fotoEmail" onchange="previewImage(this, 'preview1')">
                    <div id="preview1" class="hidden mt-2 w-full h-40 bg-gray-100 rounded flex items-center justify-center overflow-hidden"></div>
                </div>
                <div class="space-y-2">
                    <label class="block text-xs font-bold text-gray-500 uppercase">2. Foto Bill</label>
                    <input type="file" accept="image/*" class="file-input w-full text-xs p-2 border rounded" data-key="fotoBill" onchange="previewImage(this, 'preview2')">
                    <div id="preview2" class="hidden mt-2 w-full h-40 bg-gray-100 rounded flex items-center justify-center overflow-hidden"></div>
                </div>
            </div>
        </div>

        <div class="mt-8">
            <button type="submit" class="w-full bg-gradient-to-r from-red-900 to-red-800 hover:from-red-800 hover:to-red-700 text-white font-bold py-4 rounded-lg shadow-lg transition transform active:scale-[0.99]">SIMPAN & KIRIM BERITA ACARA</button>
        </div>
    </form>
</div>

<script>
    window.formatRupiah = (num) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(num);
    window.parseRupiah = (str) => parseFloat(str.replace(/[^0-9,-]+/g,"").replace(",", ".")) || 0;

    window.previewImage = function(input, previewId) {
        const previewDiv = document.getElementById(previewId);
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                previewDiv.innerHTML = `<img src="${e.target.result}" class="w-full h-full object-cover">`;
                previewDiv.classList.remove('hidden');
            }
            reader.readAsDataURL(input.files[0]);
        } else { previewDiv.classList.add('hidden'); }
    };

    (function() {
        // 1. Load User
        const user = window.GLOBAL_USER;
        if(user) {
            document.getElementById('f_nama').value = user.NAME || '';
            document.getElementById('f_nik').value = user.NIK || '';
            document.getElementById('f_outlet').value = user.OUTLET || '';
            document.getElementById('f_posisi').value = user.POSITION || '';
        }

        // 2. Tanggal
        document.getElementById('dateInput').addEventListener('change', function() {
            const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
            const d = new Date(this.value);
            if(!isNaN(d.getTime())) document.getElementById('dayOutput').value = days[d.getDay()];
        });

        // 3. Total Bill
        document.getElementById('totalBillInput').addEventListener('keyup', function(e) {
            const val = window.parseRupiah(this.value);
            this.value = window.formatRupiah(val).replace('Rp', '').trim();
        });

        // 4. Table Logic
        window.addItemRow = function() {
            const tbody = document.getElementById('itemContainer');
            const rowCount = tbody.rows.length + 1;
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="py-2 px-3 text-center text-gray-500 align-middle">${rowCount}</td>
                <td class="py-2 px-3"><input type="text" class="w-full border-b border-gray-300 outline-none py-1 focus:border-red-800 bg-transparent" placeholder="Nama Menu" required></td>
                <td class="py-2 px-3"><input type="number" class="w-full text-center border-b border-gray-300 outline-none py-1 focus:border-red-800 bg-transparent" value="1" min="1" required></td>
                <td class="py-2 px-3 text-center"><button type="button" onclick="this.closest('tr').remove(); window.recalcNumbers();" class="text-red-500 font-bold text-lg">×</button></td>
            `;
            tbody.appendChild(tr);
        };

        window.recalcNumbers = function() {
            document.querySelectorAll('#itemContainer tr').forEach((tr, index) => { tr.querySelector('td:first-child').textContent = index + 1; });
        }

        document.getElementById('btnAddItem').addEventListener('click', window.addItemRow);
        window.addItemRow();

        // 5. Submit
        const form = document.getElementById('baForm');
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = form.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;
            btn.disabled = true; btn.innerHTML = 'Memproses...';

            const items = [];
            document.querySelectorAll('#itemContainer tr').forEach(tr => {
                const inputs = tr.querySelectorAll('input');
                items.push({
                    item: inputs[0].value,
                    qty: inputs[1].value
                });
            });

            const formData = {
                tanggal: form.querySelector('[name="tanggal"]').value,
                hari: form.querySelector('[name="hari"]').value,
                namaFoodies: form.querySelector('[name="namaFoodies"]').value,
                noBill: form.querySelector('[name="noBill"]').value,
                totalBill: form.querySelector('[name="totalBill"]').value,
                items: items,
                fotoEmail: null, fotoBill: null
            };

            const fileInputs = document.querySelectorAll('.file-input');
            const filePromises = Array.from(fileInputs).map(input => {
                return new Promise((resolve) => {
                    if (input.files.length > 0) {
                        const reader = new FileReader();
                        reader.onload = (e) => resolve({ key: input.dataset.key, data: e.target.result });
                        reader.readAsDataURL(input.files[0]);
                    } else { resolve({ key: input.dataset.key, data: null }); }
                });
            });

            const files = await Promise.all(filePromises);
            files.forEach(f => formData[f.key] = f.data);

            google.script.run.withSuccessHandler(res => {
                if(res.success) { alert("Berhasil! ID: " + res.baId); closeForm(); } 
                else { alert("Gagal: " + res.message); btn.disabled = false; btn.innerHTML = originalText; }
            }).rekamData(formData, 'KOL Foodies', window.GLOBAL_USER);
        });

    })();
</script>
