            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                
                <div class="bg-gray-50 p-3 rounded border border-dashed border-gray-300">

                    <input type="file" id="filePOS" accept="image/*" multiple class="w-full text-xs" onchange="previewMultiple(this, 'previewPOS')">
                    <div id="previewPOS" class="grid grid-cols-2 gap-2 mt-3"></div> </div>

                    <label class="block text-xs font-bold text-gray-600 uppercase mb-2">3. Foto Makanan Jadi</label>
                    <input type="file" id="fileFood" accept="image/*" multiple class="w-full text-xs" onchange="previewMultiple(this, 'previewFood')">
                    <div id="previewFood" class="grid grid-cols-2 gap-2 mt-3"></div> </div>

            </div>
            <p class="text-[10px] text-gray-400 mt-2 italic">*Bisa pilih lebih dari 1 foto untuk setiap kategori.</p>

                SIMPAN & KIRIM
            </button>

<script>
    // --- UTILITIES ---
    window.formatRupiah = (num) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(num);
    window.parseRupiah = (str) => parseFloat(str.replace(/[^0-9,-]+/g,"").replace(",", ".")) || 0;

    // --- PREVIEW FUNCTION FOR MULTIPLE IMAGES ---
    window.previewMultiple = function(input, containerId) {
        const container = document.getElementById(containerId);
        container.innerHTML = ''; // Reset container

        if (input.files) {
            Array.from(input.files).forEach(file => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    // Create minimal image card
                    const imgDiv = document.createElement('div');
                    imgDiv.className = "relative h-20 w-full bg-white border rounded overflow-hidden shadow-sm";
                    imgDiv.innerHTML = `<img src="${e.target.result}" class="w-full h-full object-cover hover:scale-110 transition duration-300">`;
                    container.appendChild(imgDiv);
                }
                reader.readAsDataURL(file);
            });
        }
    };

    // --- HELPER: CONVERT FILES TO BASE64 ARRAY ---
    window.getFilesBase64 = async function(inputId) {
        const input = document.getElementById(inputId);
        if (!input || input.files.length === 0) return [];

        const promises = Array.from(input.files).map(file => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result); // Base64 String
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        });

        return await Promise.all(promises);
    };

    // --- MAIN LOGIC ---
    (function() {
        // 1. Load User Data
        const user = window.GLOBAL_USER;
        if(user) {
            document.getElementById('c_nama').value = user.NAME || '';
            document.getElementById('c_nik').value = user.NIK || '';
            document.getElementById('c_outlet').value = user.OUTLET || '';
            document.getElementById('c_posisi').value = user.POSITION || '';
        }

        // 2. Dropdown Logic
        const platformSelect = document.getElementById('platformSelect');
        const platformLainnya = document.getElementById('platformLainnya');
        platformSelect.addEventListener('change', function() {
            if(this.value === 'Lainnya') {
                platformLainnya.classList.remove('hidden'); platformLainnya.required = true;
            } else {
                platformLainnya.classList.add('hidden'); platformLainnya.required = false; platformLainnya.value = '';
            }
        });

        // 3. Rupiah Logic
        document.getElementById('totalBillInput').addEventListener('keyup', function(e) {
            const val = window.parseRupiah(this.value);
            this.value = window.formatRupiah(val).replace('Rp', '').trim();
        });

        // 4. Table Logic
        window.addItemRow = function() {
            const tbody = document.getElementById('itemContainer');
            const rowCount = tbody.rows.length + 1;
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="py-2 px-3 text-center text-gray-500 align-middle index-cell">${rowCount}</td>
                <td class="py-2 px-3"><input type="text" class="w-full border-b border-gray-300 outline-none py-1 focus:border-red-800 bg-transparent item-input" placeholder="Nama Menu / Item" required></td>
                <td class="py-2 px-3"><input type="number" class="w-full text-center border-b border-gray-300 outline-none py-1 focus:border-red-800 bg-transparent qty-input" value="1" min="1" required></td>
                <td class="py-2 px-3 text-center"><button type="button" onclick="this.closest('tr').remove(); window.recalcIndex();" class="text-red-500 font-bold text-lg">×</button></td>
            `;
            tbody.appendChild(tr);
        };

        window.recalcIndex = function() {
            document.querySelectorAll('#itemContainer tr').forEach((tr, index) => { 
                tr.querySelector('.index-cell').textContent = index + 1; 
            });
        };

        document.getElementById('btnAddRow').addEventListener('click', window.addItemRow);
        window.addItemRow();

        // 5. SUBMIT HANDLER
        const form = document.getElementById('cancelOnlineForm');
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = form.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;
            btn.disabled = true; btn.innerHTML = 'Mengupload Data...';

            try {
                // Prepare Basic Data
                let platformFinal = platformSelect.value;
                if (platformFinal === 'Lainnya') platformFinal = `Lainnya: ${platformLainnya.value}`;

                const items = [];
                document.querySelectorAll('#itemContainer tr').forEach(tr => {
                    items.push({
                        item: tr.querySelector('.item-input').value,
                        qty: tr.querySelector('.qty-input').value
                    });
                });

                // --- PROCESS IMAGES (Async) ---
                // Mengambil array Base64 dari masing-masing input file
                const imagesEDC = await window.getFilesBase64('fileEDC');
                const imagesPOS = await window.getFilesBase64('filePOS');
                const imagesFood = await window.getFilesBase64('fileFood');

                // Validasi Minimal 1 foto (Opsional, jika wajib)
                if(imagesEDC.length === 0 && imagesPOS.length === 0 && imagesFood.length === 0) {
                   throw new Error("Mohon upload setidaknya satu bukti foto.");
                }

                const formData = {
                    tanggal: form.querySelector('[name="tanggal"]').value,
                    platform: platformFinal,
                    noTransaksi: form.querySelector('[name="noTransaksi"]').value,
                    noBill: form.querySelector('[name="noBill"]').value,
                    totalBill: form.querySelector('[name="totalBill"]').value,
                    alasan: form.querySelector('[name="alasan"]').value,
                    items: items,
                    // Structure for backend:
                    files: {
                        strukEDC: imagesEDC,     // Array of Base64 Strings
                        billPOS: imagesPOS,      // Array of Base64 Strings
                        fotoMakanan: imagesFood  // Array of Base64 Strings
                    }
                };

                // Send to Backend
                google.script.run.withSuccessHandler(res => {
                    if(res.success) { 
                        alert("Sukses! Berita Acara Terkirim. ID: " + res.baId); 
                        if(typeof closeForm === 'function') closeForm(); 
                    } else { 
                        throw new Error(res.message);
                    }
                }).withFailureHandler(err => {
                    throw err;
                }).rekamData(formData, 'Cancel Online', window.GLOBAL_USER);

            } catch (error) {
                alert("Error: " + error.message);
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        });
    })();
</script>
