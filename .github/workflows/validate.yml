name: Validate application

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0

      - name: Validate source
        run: npm test

      - name: Install SO parser test dependencies
        run: npm install --prefix cloudflare/inventory-api --omit=dev --ignore-scripts --no-audit --no-fund

      - name: Validate replacement SO pipeline
        run: npm run test:so-v2
