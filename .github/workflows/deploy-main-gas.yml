name: Deploy Main GAS

on:
  push:
    branches: [main]
    paths:
      - gas/**
      - scripts/validate.mjs
      - package.json
      - .github/workflows/deploy-main-gas.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main-gas-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0

      - name: Validate source
        run: npm test

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0

      - name: Check deployment secrets
        id: config
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.MAIN_GAS_CLASPRC_JSON }}
          CLASP_JSON: ${{ secrets.MAIN_GAS_CLASP_JSON }}
          GAS_DEPLOYMENT_ID: ${{ secrets.MAIN_GAS_DEPLOYMENT_ID }}
        run: |
          if test -n "$CLASPRC_JSON" && test -n "$CLASP_JSON" && test -n "$GAS_DEPLOYMENT_ID"; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deployment dilewati. Jalankan setup-main-gas-auto-deploy.ps1, lalu Run workflow kembali."
          fi

      - name: Prepare clasp credentials
        if: steps.config.outputs.configured == 'true'
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.MAIN_GAS_CLASPRC_JSON }}
          CLASP_JSON: ${{ secrets.MAIN_GAS_CLASP_JSON }}
        run: |
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          printf '%s' "$CLASP_JSON" > gas/.clasp.json
          chmod 600 "$HOME/.clasprc.json" gas/.clasp.json

      - name: Push source to Apps Script
        if: steps.config.outputs.configured == 'true'
        working-directory: gas
        run: npx --yes @google/clasp@3.1.3 push --force

      - name: Update production deployment
        if: steps.config.outputs.configured == 'true'
        working-directory: gas
        env:
          GAS_DEPLOYMENT_ID: ${{ secrets.MAIN_GAS_DEPLOYMENT_ID }}
        run: npx --yes @google/clasp@3.1.3 create-deployment --deploymentId "$GAS_DEPLOYMENT_ID" --description "GitHub main ${GITHUB_SHA::7}"

      - name: Remove temporary credentials
        if: always() && steps.config.outputs.configured == 'true'
        shell: bash
        run: |
          rm -f "$HOME/.clasprc.json" gas/.clasp.json
